<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zsömle – élő áttekintés</title>
<!-- Rejtett tulajdonosi oldal (zsomle-pekseg.hu/raktar, 2026-10-23): a tableten rögzített adatok élőben.
     Az oldal nem tartalmaz adatot; mindent a tulajdonosi jelszóval kér le a raktar_adatok függvénytől. -->
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2118;--muted:#7a6d60;--brand:#8a4b1e;--bar:#c98a55;--ok:#2f7d32;--warn:#b3261e;--line:#e4ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#28211b;--ink:#f1e9df;--muted:#b4a594;--brand:#d08a52;--bar:#a8693a;--ok:#6cc070;--warn:#ef7a6f;--line:#3d332a}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.top{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--brand);color:#fff}
.top h1{font-size:18px;margin:0;flex:1;min-width:140px}
.top button{font:inherit;border:0;border-radius:10px;padding:7px 12px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.top .nap{font-weight:600;min-width:118px;text-align:center}
.allapot{font-size:13px;opacity:.9;width:100%}
.allapot .pont{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CFC9A;margin-right:6px;vertical-align:1px}
.allapot.hiba .pont{background:#ff9b8f}
main{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.csempek{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.cs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cs .c{font-size:13px;color:var(--muted)}
.cs .e{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.cs .m{font-size:12px;color:var(--muted);margin-top:2px}
.racs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;overflow-x:auto}
.box h2{font-size:16px;margin:0 0 8px}
.box p.megj{font-size:12px;color:var(--muted);margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.sz,th.sz{text-align:right;white-space:nowrap}
tr.ossz td{font-weight:700;border-bottom:0}
.ures{color:var(--muted);font-size:14px}
.sav{display:flex;align-items:center;gap:6px}
.sav i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--bar);min-width:2px}
.sav span{font-size:13px;min-width:28px;text-align:right}
.jo{color:var(--ok)}.rossz{color:var(--warn)}
.halv{opacity:.5}
.ugro{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.ugro a{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.box{scroll-margin-top:90px}.box.szeles{grid-column:1/-1}
.belep{max-width:360px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.belep h1{font-size:20px;margin:0 0 14px}
.belep input[type=password]{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.belep button{width:100%;margin-top:12px;font:inherit;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
.belep label{display:block;margin-top:10px;font-size:14px;color:var(--muted)}
.belep .hiba{color:var(--warn);margin-top:10px;min-height:20px}
@media (max-width:420px){main{padding:12px 10px 40px}.racs{grid-template-columns:1fr}.csempek{grid-template-columns:1fr 1fr}.cs .e{font-size:20px}.box{padding:10px}table{font-size:13px}th,td{padding:4px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://dqttcjxviijeopzbqfqq.supabase.co', SB_KEY='sb_publishable_S4aefwe9JNDz5hunZdHF9Q_iRBRbmvP';
const FRISSITES_MP=10, TZ='Europe/Budapest', JK='raktar_jelszo';
// Az oldal változata: a kozzetesz.sh a közzétett példányba írja (itt 'fejlesztes'). Ha kint újabb van, az oldal újratölt.
const OLDAL_VER='20261023194438';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ft=n=>Math.round(+n||0).toLocaleString('hu-HU')+' Ft';
const db=n=>(+n||0).toLocaleString('hu-HU',{maximumFractionDigits:2});
const napStr=d=>d.toLocaleDateString('en-CA',{timeZone:TZ});
const ma=()=>napStr(new Date());
const ora=iso=>+new Date(iso).toLocaleString('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false}).slice(0,2);
const idopont=iso=>new Date(iso).toLocaleTimeString('hu-HU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const napNev=n=>new Date(n+'T12:00:00').toLocaleDateString('hu-HU',{month:'short',day:'numeric',weekday:'short'});
const lepNap=(n,d)=>{const x=new Date(n+'T12:00:00');x.setDate(x.getDate()+d);return napStr(x);};
// [név, hatás a kasszára, hatás a széfre] – mint a tablet pénz fülén és az eszközök/penzmozgas.py-ban.
const PT={nyito:['Nyitó egyenleg',1,0],penztargep:['Pénztárgép készpénz (napi zárás)',1,0],vasarlas:['Vásárlás a kasszából',-1,0],kivet:['Kivét a kasszából',-1,0],
  szefbe:['Széfbe',-1,1],szefbol:['Széfből a kasszába',1,-1],vasarlas_szef:['Vásárlás széfből',0,-1],kivet_szef:['Kivét széfből',0,-1],zaro:['Záró egyenleg (számolt)',0,0]};

let jelszo=null, nap=ma(), adat=null, arak={}, lapCsop=[], xTermekek=[], kassza=null, kasszaKor='', termekek={}, idozito=null, utolso=null, hiba=null;
try{jelszo=localStorage.getItem(JK)||sessionStorage.getItem(JK);}catch(e){}

async function rpc(fn,body){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok){const e=new Error(j.message||r.status);e.kod=j.code;throw e;}return j;}
async function torzsadat(){
  try{arak=await (await fetch('arak.json',{cache:'no-cache'})).json();}catch(e){arak={};}
  // A napi lap csoportjai és fajtái a tablet sorrendjében (a tablet saját fajtak.json-ja).
  try{lapCsop=await (await fetch('../fajtak.json',{cache:'no-cache'})).json();}catch(e){lapCsop=[];}
  try{const r=await fetch(`${SB_URL}/rest/v1/termekek?select=id,nev,ar,egyseg,kat`,{headers:{apikey:SB_KEY}});(await r.json()).forEach(t=>termekek[t.id]=t);}catch(e){}}

function belepView(uz){
  $('#app').innerHTML=`<form class="belep" onsubmit="belep(event)"><h1>Zsömle – élő áttekintés</h1>
   <input type="password" id="jsz" placeholder="Tulajdonosi jelszó" autocomplete="current-password" autofocus>
   <label><input type="checkbox" id="megjegyez" checked> Jegyezze meg ezen az eszközön</label>
   <button>Belépés</button><div class="hiba">${esc(uz||'')}</div></form>`;}
async function belep(e){e.preventDefault();const j=$('#jsz').value;if(!j)return;
  try{await rpc('raktar_adatok',{p_jelszo:j,p_nap:nap});}catch(err){belepView(err.kod==='28P01'?'Hibás jelszó.':'Nem érhető el az adatbázis: '+err.message);return;}
  jelszo=j;try{($('#megjegyez').checked?localStorage:sessionStorage).setItem(JK,j);}catch(e){}indit();}
function kilep(){try{localStorage.removeItem(JK);sessionStorage.removeItem(JK);}catch(e){}jelszo=null;clearTimeout(idozito);belepView();}

async function frissit(){clearTimeout(idozito);
  try{adat=await rpc('raktar_adatok',{p_jelszo:jelszo,p_nap:nap});await kasszaBetolt();utolso=new Date();hiba=null;}
  catch(err){if(err.kod==='28P01'){kilep();return;}hiba=err.message;}
  rajzol();
  // Csak a mai napot és csak látható lapon frissítjük; más napok adata már nem változik (javítás ritka, kézzel frissíthető).
  if(nap===ma()&&!document.hidden)idozito=setTimeout(frissit,FRISSITES_MP*1000);}
function napValt(d){nap=d===0?ma():lepNap(nap,d);if(nap>ma())nap=ma();adat=null;kasszaIdo=0;rajzol();frissit();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ujValtozat();if(jelszo){excelTermekek();frissit();}}});
// Új változat figyelése (2026-10-23: a böngésző a régi oldalt mutatta): percenként és a lap előtérbe kerülésekor.
// A verzio.txt-t gyorsítótár nélkül kéri; eltérésnél egyszer újratölt a változatszámmal (a CDN-t is megkerülve).
async function ujValtozat(){if(OLDAL_VER==='fejlesztes')return;
  try{const v=(await (await fetch('verzio.txt?t='+Date.now(),{cache:'no-store'})).text()).trim();
    if(v&&v!==OLDAL_VER&&sessionStorage.getItem('raktar_ujratoltve')!==v){sessionStorage.setItem('raktar_ujratoltve',v);location.replace(location.pathname+'?v='+v);}}catch(e){}}
setInterval(ujValtozat,60000);ujValtozat();

function szamol(){const A=adat;
  // Napi eladás lap (napi_vonal): eladva = +1/−1 koppintások összege; maradt (db) és osszeg (Foodora/Munch Ft) az utolsó beírt érték, mint a tableten.
  const V={};A.vonal.forEach(v=>{const x=V[v.fajta]||(V[v.fajta]={eladva:0,maradt:null,osszeg:null,dolg:{}});
    if(v.tipus==='eladva'){x.eladva+=+v.ertek;x.dolg[v.dolgozo]=(x.dolg[v.dolgozo]||0)+(+v.ertek);}else x[v.tipus]=+v.ertek;});
  // A napi lap fajtái a tablet Maradék fülén is szerepelhetnek: ha az Esti beírásnál nincs „maradt”, ezek összege számít (mint a tablet_import.py-ban).
  const lapNevek=new Set(lapCsop.flatMap(g=>g.fajtak)), MM={};
  A.maradek.forEach(m=>{if(lapNevek.has(m.nev))MM[m.nev]=(MM[m.nev]||0)+(+m.menny);});
  Object.entries(MM).forEach(([f,q])=>{const x=V[f]||(V[f]={eladva:0,maradt:null,osszeg:null,dolg:{}});if(x.maradt==null)x.maradt=q;});
  // Minden fajta látszik, 0-val is (mint a tableten); ami a listán nincs, de rögzítették, az „Egyéb” csoportba kerül.
  const sor=(f,g)=>{const x=V[f]||{eladva:0,maradt:null,osszeg:null};return {fajta:f,...x,csoport:g.nev,maradekos:!!g.maradek,osszeges:!!g.osszeg,
    ft:g.osszeg?(x.osszeg||0):(arak[f]?.ar?x.eladva*arak[f].ar:0)};};
  const listan=new Set(lapCsop.flatMap(g=>g.fajtak));
  const vonalSor=[...lapCsop.flatMap(g=>g.fajtak.map(f=>sor(f,g))),
    ...Object.keys(V).filter(f=>!listan.has(f)).map(f=>sor(f,{nev:'Egyéb',maradek:V[f].maradt!=null,osszeg:V[f].osszeg!=null}))];
  const lapBevetel=vonalSor.filter(s=>!s.osszeges).reduce((s,x)=>s+x.ft,0), szallitoBevetel=vonalSor.filter(s=>s.osszeges).reduce((s,x)=>s+x.ft,0);
  const sutes=A.sutes.filter(s=>+s.db>0), maradek=A.maradek.filter(m=>+m.menny>0);
  const S={};sutes.forEach(s=>{const k=s.termek_id??s.nev;const x=S[k]||(S[k]={nev:s.nev,db:0,maradt:0,selejt:0,ar:termekek[s.termek_id]?.egyseg==='db'?+termekek[s.termek_id].ar:null});x.db+=+s.db;});
  maradek.forEach(m=>{const k=m.termek_id??m.nev;if(S[k])S[k][m.tipus==='selejt'?'selejt':'maradt']+=+m.menny;});
  const sutesSor=Object.values(S).sort((a,b)=>b.db-a.db), sutesDb=sutesSor.reduce((s,x)=>s+x.db,0),
        sutesFt=sutesSor.reduce((s,x)=>s+(x.ar?(x.db-x.maradt-x.selejt)*x.ar:0),0);
  // Órák: napi eladás koppintás és sütés darab.
  const O={};const ob=h=>O[h]||(O[h]={elad:0,sut:0,penz:0});
  A.vonal.filter(v=>v.tipus==='eladva').forEach(v=>ob(ora(v.ido)).elad+=+v.ertek);
  sutes.forEach(s=>ob(ora(s.ido)).sut+=+s.db);
  A.eladas.forEach(e=>ob(ora(e.ido)).penz+=+e.osszeg);
  // Pénz: ha ma nincs nyitó számolás, az előző záró a nyitó (mint a tableten és a penzmozgas.py-ban).
  const P={};Object.keys(PT).forEach(k=>P[k]=0);A.penz.forEach(p=>{if(p.tipus in P)P[p.tipus]+=+p.osszeg;});
  const vanNyito=A.penz.some(p=>p.tipus==='nyito'&&+p.osszeg>0);
  const autoNyito=!vanNyito&&A.elozo_zaro?+A.elozo_zaro.osszeg:null;if(autoNyito!=null)P.nyito=autoNyito;
  const progKp=A.eladas.filter(e=>e.fizetes==='keszpenz').reduce((s,e)=>s+(+e.osszeg),0), progKartya=A.eladas.filter(e=>e.fizetes==='kartya').reduce((s,e)=>s+(+e.osszeg),0);
  const kassza=progKp+Object.entries(PT).reduce((a,[k,v])=>a+v[1]*P[k],0), szefValt=Object.entries(PT).reduce((a,[k,v])=>a+v[2]*P[k],0);
  const szef=A.szef_nap_elejen==null?null:+A.szef_nap_elejen+szefValt;
  // Dolgozónként: napi eladás lap Ft-ban (az ár ismert fajtáknál), sütés db, rögzített sor.
  const D={};const dd=n=>D[n]||(D[n]={elad:0,ft:0,sut:0,sor:0});
  A.vonal.forEach(v=>{dd(v.dolgozo).sor++;if(v.tipus==='eladva'){dd(v.dolgozo).elad+=+v.ertek;dd(v.dolgozo).ft+=(+v.ertek)*(arak[v.fajta]?.ar||0);}});
  sutes.forEach(s=>{dd(s.dolgozo).sut+=+s.db;dd(s.dolgozo).sor++;});maradek.forEach(m=>dd(m.dolgozo).sor++);A.penz.forEach(p=>dd(p.dolgozo).sor++);
  A.eladas.forEach(e=>{dd(e.dolgozo).ft+=+e.osszeg;dd(e.dolgozo).sor++;});
  // Programbeli eladás termékenként és ÁFA szerint (mint a tablet Statisztika fülén).
  const T={},AF={};A.eladas.forEach(e=>(e.tetelek||[]).forEach(t=>{const x=T[t.nev]||(T[t.nev]={menny:0,egyseg:t.egyseg,ft:0});x.menny+=+t.menny;x.ft+=+t.osszeg;
    const a=t.afa??'?';AF[a]=(AF[a]||0)+(+t.osszeg);}));
  return {vonalSor,lapBevetel,szallitoBevetel,sutesSor,sutesDb,sutesFt,O,P,autoNyito,progKp,progKartya,kassza,szefValt,szef,D,maradek,T,AF};}

const javSzov=(x,eredeti,eg)=>x.javitva?` · javítva${eredeti!=null?' (eredetileg '+esc(eredeti)+(eg?' '+esc(eg):'')+(x.javito?', '+esc(x.javito):'')+')':''}`:'';
const cimletSzov=c=>c?Object.entries(c).filter(([k])=>k!=='fiok').sort((a,b)=>b[0]-a[0]).map(([k,d])=>(+k).toLocaleString('hu-HU')+' × '+d).concat(c.fiok?['fiók '+ft(c.fiok)]:[]).join(', '):'';
// Egy nap kassza-összevetése: a lányok pénzmozgása szerinti készpénzes forgalom (záró − nyitó + kifizetések + széfbe − széfből)
// a Z-szalag készpénzéhez; a Z-szalag a forgalmi Excelhez (C pénztárgép, D bankkártya, Z vevőszám). Pozitív = többlet.
const TUR=500; // ennyi Ft-on belül egyezőnek vesszük (aprópénz, kerekítés)
function kasszaNap(P,elozoZaro,X){const S={};P.forEach(p=>{S[p.tipus]=(S[p.tipus]||0)+(+p.osszeg||0);});const g=k=>S[k]||0;
  const zr=P.filter(p=>p.tipus==='penztargep'&&+p.osszeg>0).slice(-1)[0];const z=zr?(zr.zaras||{keszpenz:+zr.osszeg}):null;
  const vanNyito=P.some(p=>p.tipus==='nyito'&&+p.osszeg>0), nyito=vanNyito?g('nyito'):elozoZaro, zaro=P.some(p=>p.tipus==='zaro'&&+p.osszeg>0)?g('zaro'):null;
  const kifiz=g('vasarlas')+g('kivet')+g('szefbe')-g('szefbol');
  const lanyok=zaro!=null&&nyito!=null?zaro-nyito+kifiz:null, kul=lanyok!=null&&z&&z.keszpenz!=null?lanyok-z.keszpenz:null;
  return {z,nyito,autoNyito:!vanNyito&&nyito!=null,zaro,kifiz,lanyok,kul,X,
    xForg:X&&z&&z.forgalom!=null&&X.penztargep!=null?z.forgalom-X.penztargep:null,
    xKartya:X&&z&&z.kartya!=null&&X.kartya!=null?z.kartya-X.kartya:null,
    xVevo:X&&z&&z.vevo!=null&&X.vevo!=null?z.vevo-X.vevo:null};}
const elterSzov=k=>k==null?'–':Math.abs(k)<=TUR?'<span class="jo">egyezik</span>'+(k?` <span class="ures">(${k>0?'+':'−'}${ft(Math.abs(k))})</span>`:''):`<b class="rossz">${k>0?'többlet +':'hiány −'} ${ft(Math.abs(k))}</b>`;
function savok(ertek,max){return `<div class="sav"><i style="width:${max?Math.round(ertek/max*100):0}%"></i><span>${db(ertek)}</span></div>`;}

function rajzol(){
  const allapot=hiba?`<div class="allapot hiba"><span class="pont"></span>Nem sikerült frissíteni (${esc(hiba)}) – újrapróbálom</div>`
    :`<div class="allapot"><span class="pont"></span>${utolso?'Frissítve '+utolso.toLocaleTimeString('hu-HU')+(nap===ma()?` · ${FRISSITES_MP} másodpercenként frissül`:''):'Betöltés…'}</div>`;
  const fej=`<div class="top"><h1>Zsömle – élő áttekintés</h1><button onclick="napValt(-1)" aria-label="Előző nap">‹</button><span class="nap">${nap===ma()?'Ma, ':''}${napNev(nap)}</span>
    <button onclick="napValt(1)" aria-label="Következő nap" ${nap===ma()?'disabled style="opacity:.4"':''}>›</button>${nap!==ma()?'<button onclick="napValt(0)">Ma</button>':''}<button onclick="frissit()">Frissítés</button><button onclick="kilep()">Kilépés</button>${allapot}</div>`;
  if(!adat){$('#app').innerHTML=fej+'<main><p class="ures">Betöltés…</p></main>';return;}
  const R=szamol(), A=adat;
  const csempe=(c,e,m)=>`<div class="cs"><div class="c">${c}</div><div class="e">${e}</div>${m?`<div class="m">${m}</div>`:''}</div>`;
  const csempek=`<div class="csempek">
    ${csempe('Napi eladás lap',ft(R.lapBevetel),'hot dog, hamburger, szendvics, kávé – listaáron')}
    ${csempe('Foodora',ft(R.szallitoBevetel),'a beírt napi összeg')}
    ${csempe('Beérkezett áru',ft(A.beerkezes.reduce((s,b)=>s+(+b.menny)*(+b.brutto_egysegar||0),0)),A.beerkezes.length?new Set(A.beerkezes.map(b=>b.beszallito)).size+' beszállító, bruttó':'esti körben kerül fel')}
    ${csempe('Fornetti sütés',db(R.sutesDb)+' db',R.sutesFt?'eladva kb. '+ft(R.sutesFt):'')}
    ${csempe('Maradék / selejt',R.maradek.length+' tétel',R.maradek.filter(m=>m.tipus==='selejt').length+' selejt')}

    :'<p class="ures">Ma még nem ütöttek eladást a tablet Eladás fülén. (A pénztárgépen ütött eladás nem itt látszik.)</p>'}</div>`;
  // Forgalom (Excel): a forgalmi munkafüzet 2026-os lapja és Havi összesítője, esti feltöltés (eszközök/excel_web.py).
  const XN=A.excel_honap.find(x=>x['Dátum']===nap), xft=v=>v==null||v===''?'':ft(v);
  const BEV=[['Készpénz bevétel','Pénztárgép (C)'],['Bankkártyás bevétel','ebből bankkártya (tájékoztató)'],['Egyéb terminál (Droid)','Egyéb terminál'],['Foodora (házhozszállítás)','Foodora'],['Munch','Munch']];
  const KOLT=[['Bérköltség','Bér'],['Adó / járulék','Adó, járulék'],['Egyéb költség (korábbi, nem részletezett)','Egyéb (régi)'],['Foodora költség','Foodora költség'],['Munch költség','Munch költség']];
  const NEM_BESZ=new Set(['Dátum','Hónap','Bevétel összesen','Költség összesen','Napi eredmény','Vevőszám','Vázsonyi saját','K&A saját','RántottH','zsömlesSZ','hotdog','hamburger','körözöttes kifli','kávé','tea','forró csoki','palacsinta','rántott sajt','Foodora (db)','Munch (db)',...BEV.map(x=>x[0]),...KOLT.map(x=>x[0])]);
  // A 2026-os lap napi termékdarabszám-oszlopai (fejléc → felirat), a Termékek lap sorrendjében.
  const TERMEK_OSZL=[['RántottH','Rántott húsos'],['zsömlesSZ','Sonkás/szalámis'],['hotdog','Hot dog'],['hamburger','Hamburger'],['körözöttes kifli','Körözöttes kifli'],
    ['kávé','Kávé'],['tea','Tea'],['forró csoki','Forró csoki'],['palacsinta','Palacsinta'],['rántott sajt','Rántott sajt'],['Foodora (db)','Foodora (rendelés)'],['Munch (db)','Munch (csomag)']];
  const besz=XN?Object.entries(XN).filter(([k,v])=>!NEM_BESZ.has(k)&&!k.includes('(tájékoztató)')&&typeof v==='number'&&v).sort((a,b)=>b[1]-a[1]):[];
  const napX=XN?`<div class="racs" style="gap:10px"><table><tr><th>Bevétel</th><th class="sz"></th></tr>
      ${BEV.filter(([k])=>XN[k]).map(([k,n])=>`<tr><td>${n}</td><td class="sz">${xft(XN[k])}</td></tr>`).join('')}
      <tr class="ossz"><td>Bevétel összesen</td><td class="sz">${xft(XN['Bevétel összesen'])}</td></tr></table>
    <table><tr><th>Költség</th><th class="sz"></th></tr>

    :'<p class="ures">Erre a napra nincs sor a forgalmi lapon.</p>';
  const ho=A.excel_honap.filter(x=>x['Bevétel összesen']||x['Költség összesen']);
  const sum=k=>ho.reduce((s,x)=>s+(+x[k]||0),0);
  const hoT=TERMEK_OSZL.filter(([k])=>ho.some(x=>x[k]));
  const honapX=ho.length?`<table><tr><th>Nap</th><th class="sz">Bevétel</th><th class="sz">Költség</th><th class="sz">Eredmény</th><th class="sz">Vevő</th>${hoT.map(([k,n])=>`<th class="sz">${n}</th>`).join('')}</tr>
    ${ho.map(x=>`<tr${x['Dátum']===nap?' style="background:var(--bg)"':''}><td>${napNev(x['Dátum'])}</td><td class="sz">${xft(x['Bevétel összesen'])}</td><td class="sz">${xft(x['Költség összesen'])}</td><td class="sz ${(x['Napi eredmény']||0)>=0?'':'rossz'}">${xft(x['Napi eredmény'])}</td><td class="sz">${x['Vevőszám']?db(x['Vevőszám']):''}</td>${hoT.map(([k])=>`<td class="sz">${x[k]?db(x[k]):''}</td>`).join('')}</tr>`).join('')}
    <tr class="ossz"><td>Összesen</td><td class="sz">${ft(sum('Bevétel összesen'))}</td><td class="sz">${ft(sum('Költség összesen'))}</td><td class="sz">${ft(sum('Napi eredmény'))}</td><td class="sz">${db(sum('Vevőszám'))}</td>${hoT.map(([k])=>`<td class="sz">${db(sum(k))}</td>`).join('')}</tr></table>`:'<p class="ures">Ebben a hónapban még nincs forgalmi adat.</p>';
  const evek=[...new Set(A.excel_havi.flatMap(x=>Object.keys(x)).map(k=>(k.match(/^(\d{4}) Bevétel$/)||[])[1]).filter(Boolean))].sort().reverse();
  const haviX=A.excel_havi.length?`<table><tr><th>Hónap</th>${evek.map(e=>`<th class="sz">${e} bevétel</th><th class="sz">${e} költség</th><th class="sz">${e} eredmény</th>`).join('')}</tr>
    ${A.excel_havi.map(x=>`<tr><td>${esc(x['Hónap'])}</td>${evek.map(e=>`<td class="sz">${x[e+' Bevétel']?xft(x[e+' Bevétel']):''}</td><td class="sz">${x[e+' Költség']?xft(x[e+' Költség']):''}</td><td class="sz">${x[e+' Bevétel']||x[e+' Költség']?xft(x[e+' Eredmény']):''}</td>`).join('')}</tr>`).join('')}</table>`:'';
  // Termékek havonta (a Termékek lap): csak a forgalmas hónapok és a valaha eladott termékek
  const tSor=xTermekek.filter(x=>x['Hónap']!=='Éves összesen'&&TERMEK_OSZL.some(([k])=>x[k])), tEv=xTermekek.find(x=>x['Hónap']==='Éves összesen');
  const tOszl=TERMEK_OSZL.filter(([k])=>tSor.some(x=>x[k]));
  const termekX=tSor.length?`<table><tr><th>Hónap</th>${tOszl.map(([k,n])=>`<th class="sz">${n}</th>`).join('')}</tr>
    ${tSor.map(x=>`<tr><td>${esc(x['Hónap'])}</td>${tOszl.map(([k])=>`<td class="sz">${x[k]?db(x[k]):''}</td>`).join('')}</tr>`).join('')}

  const excelBox=`<div class="box szeles" id="excel"><h2>Forgalom (Excel) – ${napNev(nap)}</h2>${napX}
    <h2 style="margin-top:14px">A hónap napjai</h2>${honapX}
    ${termekX?`<h2 style="margin-top:14px">Termékek havonta (db)</h2>${termekX}`:''}
    ${haviX?`<h2 style="margin-top:14px">Havi összesítő</h2>${haviX}`:''}
    <p class="megj">A forgalmi munkafüzetből, az esti körben frissül${A.excel_feltoltve?' (utoljára '+new Date(A.excel_feltoltve).toLocaleString('hu-HU',{timeZone:TZ,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+')':''}. A teljes Excel-fájlok a OneDrive „Zsömle Excel (napi másolat)” mappájában vannak.</p></div>`;
  // Kassza-ellenőrzés: a hónap napjai és kiértékelés (csak a tulajdonosi oldalon)
  let kasszaBox='';
  if(kassza){const PN={};kassza.penz.forEach(p=>(PN[p.nap]=PN[p.nap]||[]).push(p));const XM={};kassza.excel.forEach(x=>XM[x.nap]=x);
    let lz=kassza.elozo_zaro!=null?+kassza.elozo_zaro:null;const napok=[];
    Object.keys(PN).sort().forEach(n=>{const K=kasszaNap(PN[n],lz,XM[n]);napok.push({n,...K});if(K.zaro!=null)lz=K.zaro;});
    const teljes=napok.filter(x=>x.kul!=null), egy=teljes.filter(x=>Math.abs(x.kul)<=TUR), hiany=teljes.filter(x=>x.kul<-TUR), tobb=teljes.filter(x=>x.kul>TUR);
    const szum=teljes.reduce((s,x)=>s+x.kul,0), legr=hiany.slice().sort((a,b)=>a.kul-b.kul)[0];
    const nincsZ=napok.filter(x=>!x.z), nincsZaro=napok.filter(x=>x.zaro==null), nincsNyito=napok.filter(x=>x.nyito==null);
    const xElt=napok.filter(x=>x.xForg!=null&&Math.abs(x.xForg)>TUR);
    const pont=[];
    if(teljes.length)pont.push(`${teljes.length} teljes napból (nyitó, Z-szalag és záró is van) <b>${egy.length}</b> egyezett ±${ft(TUR)}-on belül, <b>${hiany.length}</b> napon hiány, <b>${tobb.length}</b> napon többlet volt.`);
    if(teljes.length)pont.push(`A különbségek összege: ${elterSzov(szum).replace('egyezik','közel nulla')}${teljes.length>1?`, átlagosan ${ft(Math.abs(szum/teljes.length))} naponta (${szum<0?'hiány':'többlet'})`:''}.`);
    if(legr)pont.push(`A legnagyobb hiány: ${napNev(legr.n)}, ${ft(-legr.kul)} – nézd meg aznap a kivéteket, vásárlásokat és a széfbe tett pénzt (kimaradt vagy kétszer beírt tétel?).`);
    if(tobb.length)pont.push(`Többlet: ${tobb.map(x=>napNev(x.n)+' +'+ft(x.kul)).join(', ')} – gyakran be nem írt kivét vagy rosszul számolt nyitó.`);
    if(nincsZ.length)pont.push(`Z-szalag nincs beírva: ${nincsZ.map(x=>napNev(x.n)).join(', ')}.`);
    if(nincsZaro.length)pont.push(`Záró számolás nincs: ${nincsZaro.map(x=>napNev(x.n)).join(', ')}.`);
    if(nincsNyito.length)pont.push(`Nyitó egyenleg nincs (és előző záró sem): ${nincsNyito.map(x=>napNev(x.n)).join(', ')}.`);
    if(xElt.length)pont.push(`A Z-szalag forgalma eltér az Excel pénztárgép-oszlopától: ${xElt.map(x=>napNev(x.n)+' ('+(x.xForg>0?'+':'−')+ft(Math.abs(x.xForg))+')').join(', ')}.`);
    if(!pont.length)pont.push('Ebben a hónapban még nincs kiértékelhető nap.');
    kasszaBox=`<div class="box szeles" id="kassza"><h2>Kassza-ellenőrzés – ${new Date(nap+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long'})}</h2>
      <ul style="margin:0 0 10px;padding-left:18px">${pont.map(x=>`<li style="margin:3px 0">${x}</li>`).join('')}</ul>
      <table><tr><th>Nap</th><th class="sz">Nyitó</th><th class="sz">Z forgalom</th><th class="sz">Z készpénz</th><th class="sz">Z kártya</th><th class="sz">Z vevő</th><th class="sz">Kifizetések</th><th class="sz">Záró</th><th class="sz">Lányok szerint kp.</th><th class="sz">Különbség</th><th class="sz">Z − Excel C</th></tr>
      ${napok.slice().reverse().map(x=>`<tr${x.n===nap?' style="background:var(--bg)"':''}><td>${napNev(x.n)}</td><td class="sz">${x.nyito!=null?ft(x.nyito)+(x.autoNyito?'*':''):'–'}</td><td class="sz">${x.z&&x.z.forgalom!=null?ft(x.z.forgalom):'–'}</td><td class="sz">${x.z?ft(x.z.keszpenz):'–'}</td><td class="sz">${x.z&&x.z.kartya!=null?ft(x.z.kartya):'–'}</td><td class="sz">${x.z&&x.z.vevo!=null?db(x.z.vevo):'–'}</td><td class="sz">${ft(x.kifiz)}</td><td class="sz">${x.zaro!=null?ft(x.zaro):'–'}</td><td class="sz">${x.lanyok!=null?ft(x.lanyok):'–'}</td><td class="sz">${elterSzov(x.kul)}</td><td class="sz">${x.xForg==null?'–':elterSzov(x.xForg)}</td></tr>`).join('')}</table>
      <p class="megj">Különbség = a lányok pénzmozgása szerinti készpénzes forgalom (záró − nyitó + vásárlás, kivét, széfbe − széfből) − a Z-szalag készpénze; pozitív = többlet a kasszában, negatív = hiány. ±${ft(TUR)} egyezésnek számít. * = nincs nyitó számolás, az előző záró a nyitó. A korábbi napokon a Z-szalag helyett a forgalmi Excelből beírt pénztárgép-készpénz szerepel (forgalom, kártya, vevőszám nélkül). Ezt csak a tulajdonosi oldal mutatja, a tableten a lányok nem látják.</p></div>`;}
  // Dolgozónként
  const dl=Object.entries(R.D).sort((a,b)=>b[1].ft-a[1].ft);

// A forgalmi Excel „Termékek” lapja (havi darabszámok): esténként változik, ezért csak belépéskor és előtérbe kerüléskor kérjük le.
async function excelTermekek(){if(!jelszo)return;try{xTermekek=await rpc('raktar_excel_termekek',{p_jelszo:jelszo});}catch(e){}}
// Kassza-ellenőrzés (2026-10-23): a kiválasztott nap hónapjának pénzmozgása, Z-szalagjai és a forgalmi Excel bevételi sorai.
// Percenként és hónapváltáskor kérjük le (a 10 mp-es frissítésnél ritkábban, mert több napot hoz).
let kasszaIdo=0;
async function kasszaBetolt(){if(!jelszo)return;const tol=nap.slice(0,8)+'01',ho=new Date(nap.slice(0,7)+'-01T12:00:00');ho.setMonth(ho.getMonth()+1);ho.setDate(0);
  const ig=napStr(ho)<ma()?napStr(ho):ma();if(kasszaKor===tol&&Date.now()-kasszaIdo<60000)return;
  try{kassza=await rpc('raktar_kassza',{p_jelszo:jelszo,p_tol:tol,p_ig:ig});kasszaKor=tol;kasszaIdo=Date.now();}catch(e){}}
async function indit(){adat=null;rajzol();await torzsadat();await excelTermekek();await kasszaBetolt();frissit();}
jelszo?indit():belepView();
