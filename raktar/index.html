<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zsömle – élő áttekintés</title>
<!-- Rejtett tulajdonosi oldal (zsomle-pekseg.hu/raktar, 2026-10-23): a tableten rögzített adatok élőben.
     Az oldal nem tartalmaz adatot; mindent a tulajdonosi jelszóval kér le a raktar_adatok függvénytől. -->
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2118;--muted:#7a6d60;--brand:#8a4b1e;--bar:#c98a55;--ok:#2f7d32;--warn:#b3261e;--line:#e4ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#28211b;--ink:#f1e9df;--muted:#b4a594;--brand:#d08a52;--bar:#a8693a;--ok:#6cc070;--warn:#ef7a6f;--line:#3d332a}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.top{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--brand);color:#fff}
.top h1{font-size:18px;margin:0;flex:1;min-width:140px}
.top button{font:inherit;border:0;border-radius:10px;padding:7px 12px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.top .nap{font-weight:600;min-width:118px;text-align:center}
.allapot{font-size:13px;opacity:.9;width:100%}
.allapot .pont{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CFC9A;margin-right:6px;vertical-align:1px}
.allapot.hiba .pont{background:#ff9b8f}
main{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.csempek{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.cs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cs .c{font-size:13px;color:var(--muted)}
.cs .e{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.cs .m{font-size:12px;color:var(--muted);margin-top:2px}
.racs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;overflow-x:auto}
.box h2{font-size:16px;margin:0 0 8px}
.box p.megj{font-size:12px;color:var(--muted);margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.sz,th.sz{text-align:right;white-space:nowrap}
tr.ossz td{font-weight:700;border-bottom:0}
.ures{color:var(--muted);font-size:14px}
.sav{display:flex;align-items:center;gap:6px}
.sav i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--bar);min-width:2px}
.sav span{font-size:13px;min-width:28px;text-align:right}
.jo{color:var(--ok)}.rossz{color:var(--warn)}
.halv{opacity:.5}
.ugro{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.ugro a{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.box{scroll-margin-top:90px}.box.szeles{grid-column:1/-1}
.belep{max-width:360px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.belep h1{font-size:20px;margin:0 0 14px}
.belep input[type=password]{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.belep button{width:100%;margin-top:12px;font:inherit;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
.belep label{display:block;margin-top:10px;font-size:14px;color:var(--muted)}
.belep .hiba{color:var(--warn);margin-top:10px;min-height:20px}
@media (max-width:420px){main{padding:12px 10px 40px}.racs{grid-template-columns:1fr}.csempek{grid-template-columns:1fr 1fr}.cs .e{font-size:20px}.box{padding:10px}table{font-size:13px}th,td{padding:4px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://dqttcjxviijeopzbqfqq.supabase.co', SB_KEY='sb_publishable_S4aefwe9JNDz5hunZdHF9Q_iRBRbmvP';
const FRISSITES_MP=10, TZ='Europe/Budapest', JK='raktar_jelszo';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ft=n=>Math.round(+n||0).toLocaleString('hu-HU')+' Ft';
const db=n=>(+n||0).toLocaleString('hu-HU',{maximumFractionDigits:2});
const napStr=d=>d.toLocaleDateString('en-CA',{timeZone:TZ});
const ma=()=>napStr(new Date());
const ora=iso=>+new Date(iso).toLocaleString('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false}).slice(0,2);
const idopont=iso=>new Date(iso).toLocaleTimeString('hu-HU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const napNev=n=>new Date(n+'T12:00:00').toLocaleDateString('hu-HU',{month:'short',day:'numeric',weekday:'short'});
const lepNap=(n,d)=>{const x=new Date(n+'T12:00:00');x.setDate(x.getDate()+d);return napStr(x);};
// [név, hatás a kasszára, hatás a széfre] – mint a tablet pénz fülén és az eszközök/penzmozgas.py-ban.
const PT={nyito:['Nyitó egyenleg',1,0],penztargep:['Pénztárgép készpénz (napi zárás)',1,0],vasarlas:['Vásárlás a kasszából',-1,0],kivet:['Kivét a kasszából',-1,0],
  szefbe:['Széfbe',-1,1],szefbol:['Széfből a kasszába',1,-1],vasarlas_szef:['Vásárlás széfből',0,-1],kivet_szef:['Kivét széfből',0,-1],zaro:['Záró egyenleg (számolt)',0,0]};

let jelszo=null, nap=ma(), adat=null, arak={}, lapCsop=[], termekek={}, idozito=null, utolso=null, hiba=null;
try{jelszo=localStorage.getItem(JK)||sessionStorage.getItem(JK);}catch(e){}

async function rpc(fn,body){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok){const e=new Error(j.message||r.status);e.kod=j.code;throw e;}return j;}
async function torzsadat(){
  try{arak=await (await fetch('arak.json',{cache:'no-cache'})).json();}catch(e){arak={};}
  // A napi lap csoportjai és fajtái a tablet sorrendjében (a tablet saját fajtak.json-ja).
  try{lapCsop=await (await fetch('../fajtak.json',{cache:'no-cache'})).json();}catch(e){lapCsop=[];}
  try{const r=await fetch(`${SB_URL}/rest/v1/termekek?select=id,nev,ar,egyseg,kat`,{headers:{apikey:SB_KEY}});(await r.json()).forEach(t=>termekek[t.id]=t);}catch(e){}}

function belepView(uz){
  $('#app').innerHTML=`<form class="belep" onsubmit="belep(event)"><h1>Zsömle – élő áttekintés</h1>
   <input type="password" id="jsz" placeholder="Tulajdonosi jelszó" autocomplete="current-password" autofocus>
   <label><input type="checkbox" id="megjegyez" checked> Jegyezze meg ezen az eszközön</label>
   <button>Belépés</button><div class="hiba">${esc(uz||'')}</div></form>`;}
async function belep(e){e.preventDefault();const j=$('#jsz').value;if(!j)return;
  try{await rpc('raktar_adatok',{p_jelszo:j,p_nap:nap});}catch(err){belepView(err.kod==='28P01'?'Hibás jelszó.':'Nem érhető el az adatbázis: '+err.message);return;}
  jelszo=j;try{($('#megjegyez').checked?localStorage:sessionStorage).setItem(JK,j);}catch(e){}indit();}
function kilep(){try{localStorage.removeItem(JK);sessionStorage.removeItem(JK);}catch(e){}jelszo=null;clearTimeout(idozito);belepView();}

async function frissit(){clearTimeout(idozito);
  try{adat=await rpc('raktar_adatok',{p_jelszo:jelszo,p_nap:nap});utolso=new Date();hiba=null;}
  catch(err){if(err.kod==='28P01'){kilep();return;}hiba=err.message;}
  rajzol();
  // Csak a mai napot és csak látható lapon frissítjük; más napok adata már nem változik (javítás ritka, kézzel frissíthető).
  if(nap===ma()&&!document.hidden)idozito=setTimeout(frissit,FRISSITES_MP*1000);}
function napValt(d){nap=d===0?ma():lepNap(nap,d);if(nap>ma())nap=ma();adat=null;rajzol();frissit();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&jelszo)frissit();});

function szamol(){const A=adat;
  // Napi eladás lap (napi_vonal): eladva = +1/−1 koppintások összege; maradt (db) és osszeg (Foodora/Munch Ft) az utolsó beírt érték, mint a tableten.
  const V={};A.vonal.forEach(v=>{const x=V[v.fajta]||(V[v.fajta]={eladva:0,maradt:null,osszeg:null,dolg:{}});
    if(v.tipus==='eladva'){x.eladva+=+v.ertek;x.dolg[v.dolgozo]=(x.dolg[v.dolgozo]||0)+(+v.ertek);}else x[v.tipus]=+v.ertek;});
  // Minden fajta látszik, 0-val is (mint a tableten); ami a listán nincs, de rögzítették, az „Egyéb” csoportba kerül.
  const sor=(f,g)=>{const x=V[f]||{eladva:0,maradt:null,osszeg:null};return {fajta:f,...x,csoport:g.nev,maradekos:!!g.maradek,osszeges:!!g.osszeg,
    ft:g.osszeg?(x.osszeg||0):(arak[f]?.ar?x.eladva*arak[f].ar:0)};};
  const listan=new Set(lapCsop.flatMap(g=>g.fajtak));
  const vonalSor=[...lapCsop.flatMap(g=>g.fajtak.map(f=>sor(f,g))),
    ...Object.keys(V).filter(f=>!listan.has(f)).map(f=>sor(f,{nev:'Egyéb',maradek:V[f].maradt!=null,osszeg:V[f].osszeg!=null}))];
  const lapBevetel=vonalSor.filter(s=>!s.osszeges).reduce((s,x)=>s+x.ft,0), szallitoBevetel=vonalSor.filter(s=>s.osszeges).reduce((s,x)=>s+x.ft,0);
  const sutes=A.sutes.filter(s=>+s.db>0), maradek=A.maradek.filter(m=>+m.menny>0);
  const S={};sutes.forEach(s=>{const k=s.termek_id??s.nev;const x=S[k]||(S[k]={nev:s.nev,db:0,maradt:0,selejt:0,ar:termekek[s.termek_id]?.egyseg==='db'?+termekek[s.termek_id].ar:null});x.db+=+s.db;});
  maradek.forEach(m=>{const k=m.termek_id??m.nev;if(S[k])S[k][m.tipus==='selejt'?'selejt':'maradt']+=+m.menny;});
  const sutesSor=Object.values(S).sort((a,b)=>b.db-a.db), sutesDb=sutesSor.reduce((s,x)=>s+x.db,0),
        sutesFt=sutesSor.reduce((s,x)=>s+(x.ar?(x.db-x.maradt-x.selejt)*x.ar:0),0);
  // Órák: napi eladás koppintás és sütés darab.
  const O={};const ob=h=>O[h]||(O[h]={elad:0,sut:0,penz:0});
  A.vonal.filter(v=>v.tipus==='eladva').forEach(v=>ob(ora(v.ido)).elad+=+v.ertek);
  sutes.forEach(s=>ob(ora(s.ido)).sut+=+s.db);
  A.eladas.forEach(e=>ob(ora(e.ido)).penz+=+e.osszeg);
  // Pénz: ha ma nincs nyitó számolás, az előző záró a nyitó (mint a tableten és a penzmozgas.py-ban).
  const P={};Object.keys(PT).forEach(k=>P[k]=0);A.penz.forEach(p=>{if(p.tipus in P)P[p.tipus]+=+p.osszeg;});
  const vanNyito=A.penz.some(p=>p.tipus==='nyito'&&+p.osszeg>0);
  const autoNyito=!vanNyito&&A.elozo_zaro?+A.elozo_zaro.osszeg:null;if(autoNyito!=null)P.nyito=autoNyito;
  const progKp=A.eladas.filter(e=>e.fizetes==='keszpenz').reduce((s,e)=>s+(+e.osszeg),0), progKartya=A.eladas.filter(e=>e.fizetes==='kartya').reduce((s,e)=>s+(+e.osszeg),0);
  const kassza=progKp+Object.entries(PT).reduce((a,[k,v])=>a+v[1]*P[k],0), szefValt=Object.entries(PT).reduce((a,[k,v])=>a+v[2]*P[k],0);
  const szef=A.szef_nap_elejen==null?null:+A.szef_nap_elejen+szefValt;
  // Dolgozónként: napi eladás lap Ft-ban (az ár ismert fajtáknál), sütés db, rögzített sor.
  const D={};const dd=n=>D[n]||(D[n]={elad:0,ft:0,sut:0,sor:0});
  A.vonal.forEach(v=>{dd(v.dolgozo).sor++;if(v.tipus==='eladva'){dd(v.dolgozo).elad+=+v.ertek;dd(v.dolgozo).ft+=(+v.ertek)*(arak[v.fajta]?.ar||0);}});
  sutes.forEach(s=>{dd(s.dolgozo).sut+=+s.db;dd(s.dolgozo).sor++;});maradek.forEach(m=>dd(m.dolgozo).sor++);A.penz.forEach(p=>dd(p.dolgozo).sor++);
  A.eladas.forEach(e=>{dd(e.dolgozo).ft+=+e.osszeg;dd(e.dolgozo).sor++;});
  // Programbeli eladás termékenként és ÁFA szerint (mint a tablet Statisztika fülén).
  const T={},AF={};A.eladas.forEach(e=>(e.tetelek||[]).forEach(t=>{const x=T[t.nev]||(T[t.nev]={menny:0,egyseg:t.egyseg,ft:0});x.menny+=+t.menny;x.ft+=+t.osszeg;
    const a=t.afa??'?';AF[a]=(AF[a]||0)+(+t.osszeg);}));
  return {vonalSor,lapBevetel,szallitoBevetel,sutesSor,sutesDb,sutesFt,O,P,autoNyito,progKp,progKartya,kassza,szefValt,szef,D,maradek,T,AF};}

const javSzov=(x,eredeti,eg)=>x.javitva?` · javítva${eredeti!=null?' (eredetileg '+esc(eredeti)+(eg?' '+esc(eg):'')+(x.javito?', '+esc(x.javito):'')+')':''}`:'';
const cimletSzov=c=>c?Object.entries(c).filter(([k])=>k!=='fiok').sort((a,b)=>b[0]-a[0]).map(([k,d])=>(+k).toLocaleString('hu-HU')+' × '+d).concat(c.fiok?['fiók '+ft(c.fiok)]:[]).join(', '):'';
function savok(ertek,max){return `<div class="sav"><i style="width:${max?Math.round(ertek/max*100):0}%"></i><span>${db(ertek)}</span></div>`;}

function rajzol(){
  const allapot=hiba?`<div class="allapot hiba"><span class="pont"></span>Nem sikerült frissíteni (${esc(hiba)}) – újrapróbálom</div>`
    :`<div class="allapot"><span class="pont"></span>${utolso?'Frissítve '+utolso.toLocaleTimeString('hu-HU')+(nap===ma()?` · ${FRISSITES_MP} másodpercenként frissül`:''):'Betöltés…'}</div>`;
  const fej=`<div class="top"><h1>Zsömle – élő áttekintés</h1><button onclick="napValt(-1)" aria-label="Előző nap">‹</button><span class="nap">${nap===ma()?'Ma, ':''}${napNev(nap)}</span>
    <button onclick="napValt(1)" aria-label="Következő nap" ${nap===ma()?'disabled style="opacity:.4"':''}>›</button>${nap!==ma()?'<button onclick="napValt(0)">Ma</button>':''}<button onclick="frissit()">Frissítés</button><button onclick="kilep()">Kilépés</button>${allapot}</div>`;
  if(!adat){$('#app').innerHTML=fej+'<main><p class="ures">Betöltés…</p></main>';return;}
  const R=szamol(), A=adat;
  const csempe=(c,e,m)=>`<div class="cs"><div class="c">${c}</div><div class="e">${e}</div>${m?`<div class="m">${m}</div>`:''}</div>`;
  const csempek=`<div class="csempek">
    ${csempe('Napi eladás lap',ft(R.lapBevetel),'hot dog, hamburger, szendvics, kávé – listaáron')}
    ${csempe('Foodora / Munch',ft(R.szallitoBevetel),'a beírt napi összeg')}
    ${csempe('Beérkezett áru',ft(A.beerkezes.reduce((s,b)=>s+(+b.menny)*(+b.brutto_egysegar||0),0)),A.beerkezes.length?new Set(A.beerkezes.map(b=>b.beszallito)).size+' beszállító, bruttó':'esti körben kerül fel')}
    ${csempe('Fornetti sütés',db(R.sutesDb)+' db',R.sutesFt?'eladva kb. '+ft(R.sutesFt):'')}
    ${csempe('Maradék / selejt',R.maradek.length+' tétel',R.maradek.filter(m=>m.tipus==='selejt').length+' selejt')}
    ${A.eladas.length?csempe('Programban eladva',ft(R.progKp+R.progKartya),`${A.eladas.length} vásárlás · kártya ${ft(R.progKartya)}`):''}
    ${csempe('Várható kassza',ft(R.kassza),A.penz.some(p=>p.tipus==='penztargep')?'pénztárgép-készpénzzel':'pénztárgép-készpénz még nincs beírva')}
    ${csempe('Széf',R.szef==null?'–':ft(R.szef),'ma '+(R.szefValt>=0?'+ ':'− ')+ft(Math.abs(R.szefValt)))}
  </div>`;
  // Óránként
  const orak=Object.keys(R.O).map(Number).sort((a,b)=>a-b);
  const mE=Math.max(0,...orak.map(h=>R.O[h].elad)), mS=Math.max(0,...orak.map(h=>R.O[h].sut));
  const orasBox=`<div class="box"><h2>Óránként</h2>${orak.length?`<table><tr><th>Óra</th><th>Napi eladás lap (db)</th><th>Fornetti sütés (db)</th>${A.eladas.length?'<th class="sz">Program Ft</th>':''}</tr>
    ${orak.map(h=>`<tr><td>${String(h).padStart(2,'0')}–${String(h+1).padStart(2,'0')}</td><td>${savok(R.O[h].elad,mE)}</td><td>${savok(R.O[h].sut,mS)}</td>${A.eladas.length?`<td class="sz">${ft(R.O[h].penz)}</td>`:''}</tr>`).join('')}</table>`:'<p class="ures">Még nincs rögzítés.</p>'}</div>`;
  // Napi eladás fajtánként
  let cs='';const vonalBox=`<div class="box" id="napilap"><h2>Napi eladás lap</h2>${R.vonalSor.length?`<table><tr><th>Fajta</th><th class="sz">Eladva</th><th class="sz">Maradt</th><th class="sz">Ft</th></tr>
    ${R.vonalSor.map(s=>{const f=s.csoport!==cs?(cs=s.csoport,`<tr><th colspan="4">${esc(cs)}</th></tr>`):'';
      return f+`<tr${s.eladva||s.maradt||s.osszeg?'':' class="halv"'}><td>${esc(s.fajta)}</td><td class="sz">${db(s.eladva)}</td><td class="sz">${s.maradekos?(s.maradt!=null?db(s.maradt):'–'):''}</td><td class="sz">${s.osszeges?(s.osszeg!=null?ft(s.osszeg):'–'):(s.ft?ft(s.ft):'')}</td></tr>`;}).join('')}
    <tr class="ossz"><td>Összesen</td><td class="sz">${db(R.vonalSor.filter(s=>!s.osszeges).reduce((a,s)=>a+s.eladva,0))}</td><td></td><td class="sz">${ft(R.lapBevetel+R.szallitoBevetel)}</td></tr></table>
    <p class="megj">A Ft a fajtalista eladási árával számolt (a Foodora/Munch sor a beírt napi összeg); menükedvezmény és extrák nélkül. A „maradt” és az összeg az esti beírásból jön; „–” = még nincs beírva.</p>`:'<p class="ures">A fajták listája nem töltődött be – frissíts.</p>'}</div>`;
  // Fornetti
  const fornBox=`<div class="box"><h2>Fornetti sütés és maradék</h2>${R.sutesSor.length?`<table><tr><th>Termék</th><th class="sz">Sütve</th><th class="sz">Maradt</th><th class="sz">Selejt</th><th class="sz">Eladva*</th></tr>
    ${R.sutesSor.map(s=>`<tr><td>${esc(s.nev)}</td><td class="sz">${db(s.db)}</td><td class="sz">${s.maradt?db(s.maradt):''}</td><td class="sz">${s.selejt?db(s.selejt):''}</td><td class="sz">${db(s.db-s.maradt-s.selejt)}</td></tr>`).join('')}
    <tr class="ossz"><td>Összesen</td><td class="sz">${db(R.sutesDb)}</td><td></td><td></td><td class="sz">${R.sutesFt?ft(R.sutesFt):''}</td></tr></table>
    <p class="megj">* sütve − maradék − selejt; a maradék általában záráskor kerül be, addig az „eladva” a kisütött mennyiség.</p>`:'<p class="ures">Ma még nem volt sütés.</p>'}</div>`;
  // Fornetti fagyasztókészlet: mindig a mostani állapot (leltár + beszerzés − a leltár óta kisütött), a napválasztótól független.
  const FK=A.fornetti_keszlet, kgdb=(v,eg)=>v==null?'–':db(eg==='kg'?Math.round(v*100)/100:v)+' '+eg;
  const fkBox=`<div class="box" id="fornetti"><h2>Fornetti fagyasztókészlet – most</h2>${FK?`<table><tr><th>Termék</th><th class="sz">Leltár</th><th class="sz">+ Besz.</th><th class="sz">− Fogyás</th><th class="sz">Most</th></tr>
    ${FK.tetelek.map(t=>`<tr><td>${esc(t.termek)}${t.leltaron?'':'<br><span class="ures">nem volt a leltáron</span>'}</td><td class="sz">${kgdb(t.leltar,t.egyseg)}</td>
      <td class="sz">${+t.beszerzes?kgdb(t.beszerzes,t.egyseg):''}</td><td class="sz">${t.fogyas==null?'?':+t.fogyas?kgdb(t.fogyas,t.egyseg)+(t.egyseg==='kg'?'<br><span class="ures">'+db(t.kisutve)+' db</span>':''):''}</td>
      <td class="sz ${t.aktualis!=null&&t.aktualis<0?'rossz':''}"><b>${kgdb(t.aktualis,t.egyseg)}</b></td></tr>`).join('')}</table>
    ${FK.egyeb.length?`<p class="megj rossz">A leltár óta kisütött, de a leltáron nem szereplő: ${FK.egyeb.map(e=>esc(e.termek)+' ('+db(e.kisutve)+' db)').join(', ')} – ellenőrizendő.</p>`:''}
    <p class="megj">Leltár: ${new Date(FK.leltar_ideje).toLocaleString('hu-HU',{timeZone:TZ,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}. A kisütés élőben vonódik le (kg-os terméknél db × sütött darabsúly / 0,9); a beszerzés az esti körben frissül (utoljára ${new Date(FK.alap_frissitve).toLocaleString('hu-HU',{timeZone:TZ,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}). „?” = nincs darabsúly, a fogyás nem számolható.</p>`
    :'<p class="ures">Még nincs feltöltött leltár.</p>'}</div>`;
  // Maradék / selejt (minden termék)
  const marBox=`<div class="box" id="maradek"><h2>Maradék és selejt</h2>${A.maradek.length?`<table><tr><th>Termék</th><th>Típus</th><th class="sz">Menny.</th><th>Ki, mikor</th></tr>
    ${A.maradek.map(m=>{const tor=+m.menny===0&&m.javitva;return `<tr${tor?' class="halv"':''}><td>${esc(m.nev)}</td><td>${m.tipus==='selejt'?'selejt':'maradék'}</td><td class="sz">${tor?'törölve':db(m.menny)+' '+esc(m.egyseg)}</td><td>${esc(m.dolgozo)} ${idopont(m.ido)}${javSzov(m,m.eredeti_menny,m.egyseg)}</td></tr>`;}).join('')}</table>`:'<p class="ures">Még nincs maradék vagy selejt.</p>'}</div>`;
  // Kifogyások
  const KM={};A.kifogy.forEach(k=>KM[k.termek]=k);const kif=Object.values(KM).filter(k=>k.ora).sort((a,b)=>a.ora.localeCompare(b.ora));
  const kifBox=`<div class="box" id="elfogyott"><h2>Mikor fogyott el?</h2>${kif.length?`<table><tr><th>Termék</th><th class="sz">Időpont</th><th>Rögzítette</th></tr>
    ${kif.map(k=>`<tr><td>${esc(k.termek)}</td><td class="sz">${esc(k.ora)}</td><td>${esc(k.dolgozo)}${javSzov(k,k.eredeti_ora)}</td></tr>`).join('')}</table>`:'<p class="ures">Ma még semmi nem fogyott el.</p>'}</div>`;
  // Kassza és széf
  const P=R.P;const sorok=Object.entries(PT).filter(([k])=>k!=='zaro'&&(P[k]||k==='nyito'||k==='penztargep'));
  const elteres=P.zaro?P.zaro-R.kassza:null;
  const penzBox=`<div class="box" id="penz"><h2>Kassza és széf</h2><table><tr><th>Tétel</th><th class="sz">Kassza</th><th class="sz">Széf</th></tr>
    ${R.szef!=null?`<tr><td>Széf a nap elején</td><td></td><td class="sz">${ft(A.szef_nap_elejen)}</td></tr>`:''}
    ${sorok.map(([k,[n,e,f]])=>`<tr><td>${k==='nyito'&&R.autoNyito!=null?n+' (előző zárásból)':n}</td><td class="sz">${e?(e>0?'+ ':'− ')+ft(P[k]):''}</td><td class="sz">${f?(f>0?'+ ':'− ')+ft(P[k]):''}</td></tr>`).join('')}
    ${R.progKp?`<tr><td>Készpénzes eladás a programban</td><td class="sz">+ ${ft(R.progKp)}</td><td></td></tr>`:''}
    <tr class="ossz"><td>Várható kassza</td><td class="sz">${ft(R.kassza)}</td><td class="sz">${R.szef==null?'':ft(R.szef)}</td></tr>
    ${P.zaro?`<tr><td>Záráskor számolt</td><td class="sz">${ft(P.zaro)}</td><td></td></tr><tr class="ossz"><td>Eltérés</td><td class="sz ${elteres===0?'jo':'rossz'}">${elteres===0?'egyezik':(elteres>0?'többlet + ':'hiány − ')+ft(Math.abs(elteres))}</td><td></td></tr>`:''}
    </table>${!A.penz.some(p=>p.tipus==='penztargep')?'<p class="megj">A pénztárgép napi készpénze záráskor kerül be; addig a várható kassza nem tartalmazza a napi bevételt.</p>':''}
    ${A.penz.length?`<h2 style="margin-top:14px">Tételesen</h2><table>${A.penz.map(p=>`<tr${+p.osszeg===0&&p.javitva?' class="halv"':''}><td>${idopont(p.ido)}</td><td>${esc((PT[p.tipus]||[p.tipus])[0])}${p.megjegyzes&&p.megjegyzes!=='címletes számolás'?'<br><span class="ures">'+esc(p.megjegyzes)+'</span>':''}${p.cimletek&&Object.keys(p.cimletek).length?'<br><span class="ures">'+esc(cimletSzov(p.cimletek))+'</span>':''}</td><td class="sz">${+p.osszeg===0&&p.javitva?'törölve':ft(p.osszeg)}</td><td>${esc(p.dolgozo)}${javSzov(p,p.eredeti_osszeg!=null?ft(p.eredeti_osszeg):null)}</td></tr>`).join('')}</table>`:''}</div>`;
  // Beérkezés termékenként (a beszerzési munkafüzet Napi beszerzés lapjából, esti körben feltöltve). Pékárunál (Váradi, K&A)
  // napi mérleg a tablet maradékaiból: eladva = jött − maradék − selejt, mint az eszközök/pekaru_haszon.py-ban.
  const MR={};A.maradek.filter(m=>+m.menny>0&&m.termek_id!=null).forEach(m=>{const x=MR[m.termek_id]||(MR[m.termek_id]={maradek:0,selejt:0});x[m.tipus==='selejt'?'selejt':'maradek']+=+m.menny;});
  const BB={};A.beerkezes.forEach(b=>{const k=(b.beszallito||'Ismeretlen beszállító');const t=(BB[k]||(BB[k]={}));
    const x=t[b.termek]||(t[b.termek]={termek:b.termek,id:b.termek_id,menny:0,ft:0,elad_ar:b.elad_ar});x.menny+=+b.menny;x.ft+=(+b.menny)*(+b.brutto_egysegar||0);});
  const pekaru=n=>/^(Váradi|K&A)/.test(n);
  const beBox=`<div class="box szeles" id="beerkezes"><h2>Beérkezett áru</h2>${A.beerkezes.length?Object.entries(BB).sort((a,b)=>pekaru(b[0])-pekaru(a[0])||a[0].localeCompare(b[0],'hu')).map(([besz,T])=>{
      const l=Object.values(T).sort((a,b)=>a.termek.localeCompare(b.termek,'hu'));const pk=pekaru(besz);let eFt=0,vFt=0;
      const sor=l.map(x=>{const m=MR[x.id]||{maradek:0,selejt:0};const el=x.menny-m.maradek-m.selejt;const be=pk&&x.elad_ar?el*x.elad_ar:0;eFt+=be;vFt+=x.ft;
        return `<tr><td>${esc(x.termek)}</td><td class="sz">${db(x.menny)}</td>${pk?`<td class="sz">${m.maradek?db(m.maradek):''}</td><td class="sz">${m.selejt?db(m.selejt):''}</td><td class="sz">${db(el)}</td><td class="sz">${be?ft(be):''}</td>`:''}<td class="sz">${x.ft?ft(x.ft):''}</td></tr>`;}).join('');
      return `<h2 style="margin-top:10px;font-size:15px">${esc(besz)}</h2><table><tr><th>Termék</th><th class="sz">Jött</th>${pk?'<th class="sz">Maradt</th><th class="sz">Selejt</th><th class="sz">Eladva*</th><th class="sz">Bevétel*</th>':''}<th class="sz">Beszerzés</th></tr>${sor}
        <tr class="ossz"><td>Összesen</td><td></td>${pk?`<td></td><td></td><td></td><td class="sz">${ft(eFt)}</td>`:''}<td class="sz">${ft(vFt)}</td></tr></table>`;}).join('')
      +`<p class="megj">A beszerzés bruttó, a szállítólevél egységárán. * Pékárunál: eladva = jött − a tableten rögzített maradék és selejt; a bevétel ennek az eladási áron számolt értéke. Amíg az esti maradék nincs beírva, az „eladva” a teljes beérkezett mennyiség. A beérkezés az esti körben frissül${A.beerkezes_feltoltve?' (utoljára '+new Date(A.beerkezes_feltoltve).toLocaleString('hu-HU',{timeZone:TZ,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+')':''}.</p>`
    :`<p class="ures">Erre a napra még nincs feldolgozott szállítólevél vagy számla (az esti körben kerül fel).</p>`}</div>`;
  // Sütés napló (a tablet Sütés fülének „Mai sütések” listája), a törölt sorokkal együtt
  const sutBox=`<div class="box" id="sutes"><h2>Sütések tételesen</h2>${A.sutes.length?`<table><tr><th>Idő</th><th>Termék</th><th class="sz">Db</th><th>Ki</th></tr>
    ${[...A.sutes].reverse().map(s=>{const tor=+s.db===0;return `<tr${tor?' class="halv"':''}><td>${idopont(s.ido)}</td><td>${esc(s.nev)}</td><td class="sz">${tor?'törölve':db(s.db)}</td><td>${esc(s.dolgozo)}${javSzov(s,s.eredeti_db,'db')}</td></tr>`;}).join('')}</table>`:'<p class="ures">Ma még nem volt sütés.</p>'}</div>`;
  // Programbeli eladás (a tablet Eladás fülén ütött vásárlások és a Statisztika fül)
  const vevo=A.eladas.length, bev=R.progKp+R.progKartya;
  const eladBox=`<div class="box" id="eladas"><h2>Eladás a programban</h2>${vevo?`<table>
    <tr><td>Bevétel</td><td class="sz"><b>${ft(bev)}</b></td></tr><tr><td>Vevőszám</td><td class="sz">${vevo}</td></tr>
    <tr><td>Átlagos kosár</td><td class="sz">${ft(bev/vevo)}</td></tr><tr><td>Készpénz / kártya</td><td class="sz">${ft(R.progKp)} / ${ft(R.progKartya)}</td></tr></table>
    <h2 style="margin-top:14px">Termékenként</h2><table><tr><th>Termék</th><th class="sz">Mennyiség</th><th class="sz">Bevétel</th></tr>
    ${Object.entries(R.T).sort((a,b)=>b[1].ft-a[1].ft).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="sz">${db(x.menny)} ${esc(x.egyseg)}</td><td class="sz">${ft(x.ft)}</td></tr>`).join('')}</table>
    <h2 style="margin-top:14px">ÁFA szerint (bruttó)</h2><table><tr><th>ÁFA</th><th class="sz">Bevétel</th><th class="sz">ebből ÁFA</th></tr>
    ${Object.entries(R.AF).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([a,v])=>`<tr><td>${a==='?'?'?':esc(a)+'%'}</td><td class="sz">${ft(v)}</td><td class="sz">${a==='?'?'–':ft(v*a/(100+ +a))}</td></tr>`).join('')}</table>
    <h2 style="margin-top:14px">Vásárlások</h2><table>${[...A.eladas].reverse().map(e=>`<tr><td>${idopont(e.ido)}</td><td>${(e.tetelek||[]).map(t=>esc(t.nev)+' '+db(t.menny)+' '+esc(t.egyseg)).join(', ')}</td><td class="sz">${ft(e.osszeg)}<br><span class="ures">${e.fizetes==='kartya'?'kártya':'készpénz'}</span></td><td>${esc(e.dolgozo)}</td></tr>`).join('')}</table>`
    :'<p class="ures">Ma még nem ütöttek eladást a tablet Eladás fülén. (A pénztárgépen ütött eladás nem itt látszik.)</p>'}</div>`;
  // Dolgozónként
  const dl=Object.entries(R.D).sort((a,b)=>b[1].ft-a[1].ft);
  const dolgBox=`<div class="box"><h2>Dolgozónként</h2>${dl.length?`<table><tr><th>Dolgozó</th><th class="sz">Eladás (db)</th><th class="sz">Eladás Ft</th><th class="sz">Sütés (db)</th><th class="sz">Rögzítés</th></tr>
    ${dl.map(([n,x])=>`<tr><td>${esc(n)}</td><td class="sz">${db(x.elad)}</td><td class="sz">${ft(x.ft)}</td><td class="sz">${db(x.sut)}</td><td class="sz">${x.sor}</td></tr>`).join('')}</table>
    <p class="megj">Az eladás a napi eladás lap koppintásai (és a programbeli eladás); a pénztárgépen ütött forgalom nincs benne.</p>`:'<p class="ures">Még nincs rögzítés.</p>'}</div>`;
  const nav=`<nav class="ugro">${[['eladas','Eladás'],['napilap','Napi lap'],['beerkezes','Beérkezés'],['sutes','Sütés'],['elfogyott','Elfogyott'],['maradek','Maradék / selejt'],['penz','Pénz'],['fornetti','Fornetti készlet']].map(([i,n])=>`<a href="#${i}">${n}</a>`).join('')}</nav>`;
  const g=window.scrollY;
  $('#app').innerHTML=fej+`<main>${csempek}${nav}<div class="racs">${orasBox}${vonalBox}${beBox}${fornBox}${fkBox}${penzBox}${marBox}${kifBox}${sutBox}${eladBox}${dolgBox}</div></main>`;
  window.scrollTo(0,g);}

async function indit(){adat=null;rajzol();await torzsadat();frissit();}
jelszo?indit():belepView();
</script>
</body>
