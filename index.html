<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zsömle bolt">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Zsömle bolt</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2118;--muted:#7a6d60;--brand:#8a4b1e;--ok:#2f7d32;--warn:#b3261e;--line:#e4ddd3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;border:0;border-radius:12px;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--brand);color:#fff}
.top h1{font-size:20px;margin:0 12px 0 0}
.top .tab{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px}
.top .tab.on{background:#fff;color:var(--brand);font-weight:600}
.top .sp{flex:1}
.top .who{font-size:15px;opacity:.9}
.net{font-size:13px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.2)}
.net:empty{display:none}
main{height:calc(100vh - 62px);height:calc(100dvh - 62px);overflow:hidden}
.sale{display:grid;grid-template-columns:1fr 340px;height:100%}
.left{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cats{display:flex;gap:6px;padding:10px;overflow-x:auto;flex:none}
.cats button{background:var(--card);padding:10px 14px;white-space:nowrap;border:1px solid var(--line)}
.cats button.on{background:var(--ink);color:#fff}
.search{margin:0 10px 8px;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 10px calc(60px + env(safe-area-inset-bottom));overflow-y:auto;flex:1;min-height:0;align-content:start;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.p{background:var(--card);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:center}
.p .kep{width:100%;aspect-ratio:4/3;border-radius:8px;background:#efe7dc center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b9a892;font-size:26px;font-weight:700}
.p .n{font-size:14px;line-height:1.2;min-height:34px}
.p .a{font-weight:700;color:var(--brand)}
.p .db{font-size:30px;font-weight:700;color:var(--brand);line-height:1}.p .mi{position:absolute;top:6px;left:6px;padding:2px 8px;border-radius:12px;background:#eee;font-size:13px;color:#555}
.lcs{padding:8px 12px 2px;font-weight:700;color:#8B5A2B}
.lapfo{display:flex;flex-direction:column;height:100%}.lapfej{display:flex;gap:8px;align-items:center;padding:8px 10px;flex:none;flex-wrap:wrap}
.lapg{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:0 10px 40px;align-content:start;-webkit-overflow-scrolling:touch}
.lgc{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:8px;text-align:center;font-size:13px;padding:4px}
.p.lt{padding:4px 4px 6px;min-height:0;gap:2px}.p.lt .lk{height:42px}.p.lt .db{font-size:26px}.p.lt .n{font-size:11.5px;line-height:1.15;min-height:26px}.p.fl{background:#fff3cd;transition:background .1s}
.par{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:6px}.ftcs{background:#fff7fa}.ftcs .db{font-size:26px}.ftcs .ftk{font-size:13px;font-weight:700;color:#7a1f3d}
.estigomb{padding:12px 16px;font-size:16px;background:#e8eef7;border:1px solid #9bb0d3;border-radius:10px;color:#1d3b66}
.vissza{padding:12px 16px;font-size:16px;background:#fff3cd;border:1px solid #e0c36a;border-radius:10px;color:#5a4400}.vissza:disabled{opacity:.45}
.p .lk{display:block;width:100%;height:64px;border-radius:6px}.p.kis{min-height:100px}.p .ora{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:12px;background:#2e7d32;color:#fff;font-size:14px;font-weight:700}
.p{position:relative}
.p .al{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:13px;background:#c0392b;color:#fff;font-size:13px;font-weight:700;line-height:26px}
.aldlg{background:#fff;border-radius:12px;padding:18px;max-width:420px;font-size:16px;line-height:1.4}
.p.kis{padding:10px;min-height:70px;justify-content:center}
.cart{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart h2{margin:12px 14px 6px;font-size:18px}
.mod{display:flex;gap:6px;margin:0 14px 8px}.mod button{flex:1;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:#fff}
.mod button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.afa5{display:inline-block;background:#2e7d32;color:#fff;border-radius:6px;padding:0 5px;font-size:12px;margin-left:4px}
.items{flex:1;overflow-y:auto;padding:0 10px 40px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid var(--line)}
.it .n{flex:1;font-size:14px}
.it button{width:36px;height:36px;background:var(--bg);font-size:20px}
.it button.jv{width:auto;padding:0 12px;font-size:15px;flex:none}
.sum{padding:12px 14px;font-size:26px;font-weight:700;display:flex;justify-content:space-between}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 12px}
.pay button{padding:20px 0;font-size:19px;color:#fff;background:var(--ok)}
.pay button.card{background:#1f5fa8}
.pay .clr{grid-column:1/3;background:var(--bg);color:var(--ink);padding:12px}
.panel{padding:16px 16px 60px;overflow-y:auto;height:100%;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:360px;max-width:94vw}
.dlg h3{margin:0 0 10px}
.dlg input{width:100%;font-size:28px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keys button{padding:16px 0;font-size:22px;background:var(--bg)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;padding:14px}
.prim{background:var(--brand);color:#fff}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px}
.login .names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px}
.login .names button{background:var(--card);border:1px solid var(--line);padding:18px 26px;font-size:19px}
.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:10}
.bar{height:10px;background:var(--brand);border-radius:5px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
/* Telefon (keskeny képernyő): a kosár alulra kerül, a fülek sorba törnek (2026-10-18) */
@media (max-width:820px){
 #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
 main{flex:1;height:auto;min-height:0}
 .top{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 10px;flex:none}.top h1{display:none}.top .tab{flex:none;white-space:nowrap}.top .tab{padding:8px 11px;font-size:14px}.top .net,.top .who{display:none}.top .sp{display:none}
 .sale{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 38dvh}
 .cart{border-left:0;border-top:2px solid var(--line)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;padding:0 8px 40px}
 .p .n{font-size:12px;min-height:30px}.p .a{font-size:13px}.cats{padding:8px}.search{margin:0 8px 6px}
 .p .db{font-size:24px}.p .lk{height:48px}
 .panel{padding:10px 10px 60px}.box table{font-size:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- beállítások -------------------------------------------------------------
// Supabase: a publishable kulcs nyilvános, a böngészőbe való; csak a termékek olvasását és a
// bekuld() függvényt engedi (a jogokat lásd db/001_alap.sql, db/002_bekuldes.sql).
const SB_URL='https://dqttcjxviijeopzbqfqq.supabase.co', SB_KEY='sb_publishable_S4aefwe9JNDz5hunZdHF9Q_iRBRbmvP';
const sb=(path,opt={})=>fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});
// Dolgozók (a tulajdonos megadása, 2026-10-16; 2026-10-17 óta 4 jegyű PIN, mindenkinek 1234 – a tulajdonos döntése). A PIN-ek helyett csak SHA-256('zsomle:'+PIN)
// lenyomat szerepel, mert a kód nyilvános tárhelyen van. Új dolgozó: lenyomat a README szerint.
const DOLGOZOK = [
  {nev:'Marcsi',h:'34f4af72eabb80ec313d893949cf1efbd11c8f6c81ac698567929b7de1805385'},
  {nev:'Niki',h:'34f4af72eabb80ec313d893949cf1efbd11c8f6c81ac698567929b7de1805385'},
  {nev:'Ildi',h:'34f4af72eabb80ec313d893949cf1efbd11c8f6c81ac698567929b7de1805385'}];
const TULAJ_H = 'a623a76850b821af97cc29e48e64916730601a751285edd0bb773991ea4d7c83';
// Dolgozói fülek (a tulajdonos döntése, 2026-10-17): eladás, sütés, maradék, pénzmozgás; a statisztika és a beállítások csak a tulajdonosé.
// Az eladás bekapcsolásához ide kell felvenni az 'elad' fület.
const DOLGOZOI_FULEK = ['elad','lap','sut','kif','mar','penz','elozo'];
let tulajJelszo = null; // csak a memóriában, a szerveres statisztikához
async function lenyomat(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('zsomle:'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
// Külső kapcsolatok: kiépítve, de a felhasználó döntése szerint (2026-10-16) kikapcsolva.
const KAPCSOLATOK = {weboldal:false, google:false, facebook:false};
const NYITVA = {1:[5,18],2:[5,18],3:[5,18],4:[5,18],5:[5,18],6:[6,12]}; // hétfő=1

// ---- tárolás: IndexedDB, internet nélkül is ------------------------------------
let db;
function openDB(){return new Promise((ok,err)=>{const r=indexedDB.open('zsomle-bolt',4);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['eladas','sutes','maradek','penz','vonal','kifogy'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};
  r.onsuccess=()=>{db=r.result;ok()};r.onerror=err;});}
function put(store,obj){return new Promise(ok=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=ok;});}
function putMany(store,arr){return new Promise(ok=>{const t=db.transaction(store,'readwrite');const s=t.objectStore(store);arr.forEach(o=>s.put(o));t.oncomplete=ok;});}
function all(store){return new Promise(ok=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>ok(q.result);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const napja=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ma=()=>napja(new Date().toISOString());
// Szinkron: minden rekord szinkron:false-szal indul; a Supabase-kapcsolat (később) ezeket küldi fel.
let szinkronFut=false, varakozik=0;
async function szinkron(){
  if(szinkronFut||!navigator.onLine)return;szinkronFut=true;
  try{const L={};for(const s of ['eladas','sutes','maradek','penz','vonal','kifogy'])L[s]=(await all(s)).filter(r=>!r.szinkron&&!r.demo);
    const n=L.eladas.length+L.sutes.length+L.maradek.length+L.penz.length+L.vonal.length+L.kifogy.length;
    if(n){const r=await fetch(SB_URL+'/rest/v1/rpc/bekuld',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({p_eladas:L.eladas,p_sutes:L.sutes,p_maradek:L.maradek,p_penz:L.penz,p_vonal:L.vonal,p_kifogy:L.kifogy})});
      if(r.ok){for(const s in L)await putMany(s,L[s].map(x=>({...x,szinkron:true})));}}
  }catch(e){}finally{szinkronFut=false;varakozik=await fuggo();const e=document.getElementById('fuggo');if(e)e.textContent=varakozik?varakozik+' felküldésre vár':'';}}
async function fuggo(){let n=0;for(const s of ['eladas','sutes','maradek','penz','vonal','kifogy'])n+=(await all(s)).filter(r=>!r.szinkron&&!r.demo).length;return n;}
setInterval(szinkron,60000);

// ---- állapot -------------------------------------------------------------------
const VALTOZAT='41'; // a fejlécben látszik, hogy a tablet melyik változatot futtatja
let helyben=false; // Helyben fogyasztás: a hot dog, szendvics, hamburger, kávé, tea, forró csoki 5% áfás (2026-10-17)
let TERMEKEK=[], user=null, tab='elad', kat='Kenyerek', keres='', kosar=[];
const ft=n=>Math.round(n).toLocaleString('hu-HU')+' Ft';
const $=s=>document.querySelector(s);
function alDlg(id){const t=TERMEKEK.find(x=>x.id===id);const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="aldlg"><b>${t.rovid||t.nev}</b><br><br><b>Allergének:</b> ${t.allergen}<br><br><span class="muted">Forrás: ${t.allergen_forras||''}</span></div>`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
async function frissit(){toast('Frissítés…');try{await szinkron();}catch(e){}
  try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();const ks=await caches.keys();for(const k of ks)await caches.delete(k);}catch(e){}
  location.replace(location.pathname+'?v='+Date.now());}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}

// ---- belépés -------------------------------------------------------------------
function loginView(){
  $('#app').innerHTML=`<div class="login"><h1>Zsömle — bolt</h1><div class="muted">Válaszd ki a neved</div>
  <div class="names">${DOLGOZOK.map((d,i)=>`<button onclick="pinDlg(${i})">${d.nev}</button>`).join('')}
  <button onclick="pinDlg(-1)">Tulajdonos</button></div>
  <p class="muted" style="text-align:center;margin-top:24px">Változat: v${VALTOZAT} · <a href="#" onclick="frissit();return false">frissítés</a></p></div>`;}
function pinDlg(i){
  numDlg(i<0?'Tulajdonosi jelszó':DOLGOZOK[i].nev+' – PIN', '', async v=>{
    const h=await lenyomat(v);
    if(i<0? h===TULAJ_H : h===DOLGOZOK[i].h){user=i<0?{nev:'Tulajdonos',tulaj:true}:{nev:DOLGOZOK[i].nev};if(i<0)tulajJelszo=v;tab=user.tulaj?'stat':DOLGOZOI_FULEK[0];render();}
    else toast('Hibás PIN');}, true, '', i<0?0:4);}

// ---- számbillentyűzet ------------------------------------------------------------
function numDlg(title,init,done,pw,unit,maxlen){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="dlg"><h3>${title}</h3><input id="nv" ${pw?'type="password"':''} value="${init}" readonly>
  ${unit?`<div class="muted" style="text-align:center;margin-top:4px">${unit}</div>`:''}
  <div class="keys">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
  <div class="row"><button data-k="x">Mégse</button><button class="prim" data-k="ok">OK</button></div></div>`;
  document.body.appendChild(m);const inp=m.querySelector('#nv');
  m.onclick=e=>{const k=e.target.dataset.k;if(k===undefined)return;
    if(k==='x')m.remove();else if(k==='ok'){m.remove();done(inp.value);}
    else if(k==='C')inp.value='';else if(k==='⌫')inp.value=inp.value.slice(0,-1);else{inp.value+=k;if(maxlen&&inp.value.length>=maxlen){m.remove();done(inp.value);}}};}

// ---- fő nézet ------------------------------------------------------------------
function render(){
  if(!user)return loginView();
  let tabs=[['elad','Eladás'],['lap','Napi lap'],['sut','Sütés'],['kif','Elfogyott'],['mar','Maradék / selejt'],['penz','Pénz'],['stat','Statisztika'],['elozo','Tegnapi maradék']];
  if(!user.tulaj){tabs=tabs.filter(([k])=>DOLGOZOI_FULEK.includes(k));if(!DOLGOZOI_FULEK.includes(tab))tab=DOLGOZOI_FULEK[0];}
  if(user.tulaj)tabs.push(['beall','Beállítások']);
  $('#app').innerHTML=`<div class="top"><h1>Zsömle</h1>${tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}
  <span class="sp"></span><span class="net" id="fuggo">${varakozik?varakozik+' felküldésre vár':''}</span><span class="net">${navigator.onLine?'online':'offline – helyben mentve'}</span>
  <span class="who">${user.nev}</span><button class="tab" title="Új változat betöltése" onclick="frissit()">v${VALTOZAT} ↻</button><button class="tab" onclick="user=null;tulajJelszo=null;kosar=[];render()">Kilépés</button></div><main id="main"></main>`;
  ({elad:saleView,lap:lapView,sut:bakeView,kif:kifView,mar:leftView,penz:penzView,stat:statView,beall:setView,elozo:elozoView})[tab]();}

// ---- eladás --------------------------------------------------------------------
// Keresés: kis- és nagybetű, valamint ékezet nélkül is talál (pl. „pogacsa”).
const nrm=x=>(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const talal=(t,q)=>nrm(t.nev+' '+(t.rovid||'')).includes(nrm(q));
let sutKeres='', marKeres='';
function cats(){return [...new Set([...TERMEKEK].sort((a,b)=>a.sorrend-b.sorrend).map(t=>t.kat))];}
function saleView(){
  const list=TERMEKEK.filter(t=>keres?talal(t,keres):t.kat===kat);
  $('#main').innerHTML=`<div class="sale"><div class="left">
   <div class="cats">${cats().map(c=>`<button class="${!keres&&c===kat?'on':''}" onclick="kat='${c}';keres='';saleView()">${c}</button>`).join('')}</div>
   <input class="search" placeholder="Keresés…" value="${keres}" oninput="keres=this.value;drawGrid()">
   <div class="grid" id="grid"></div></div>
   <div class="cart"><h2>Kosár</h2>
   <div class="mod"><button class="${helyben?'':'on'}" onclick="helyben=false;saleView()">Elvitel</button><button class="${helyben?'on':''}" onclick="helyben=true;saleView()">Helyben fogyasztás</button></div>
   <div class="items" id="items"></div>
   <div class="sum"><span>Összesen</span><span id="tot"></span></div>
   <div class="pay"><button onclick="fizet('keszpenz')">Készpénz</button><button class="card" onclick="fizet('kartya')">Kártya</button>
   <button class="clr" onclick="kosar=[];drawCart()">Kosár ürítése</button></div></div></div>`;
  drawGrid();drawCart();}
function drawGrid(){
  const list=TERMEKEK.filter(t=>keres?talal(t,keres):t.kat===kat);
  $('#grid').innerHTML=list.map(t=>csempe(t,`addItem(${t.id})`,true)).join('');}
// Csempe: felül a kép (a felhasználó készíti; addig helykitöltő), alatta a név és az ár.
function csempe(t,onclick,arral){const src=t.foto&&(/^https?:/.test(t.foto)?t.foto:'foto/'+t.foto);const kep=src?`style="background:#fff url('${src}') center/contain no-repeat"`:'';
  return `<button class="p" onclick="${onclick}"><span class="kep" ${kep}>${t.foto?'':(t.rovid||t.nev).slice(0,1)}</span>
   ${t.allergen?`<span class="al" onclick="event.stopPropagation();alDlg(${t.id})">A</span>`:''}<span class="n">${t.rovid||t.nev}</span>${arral?`<span class="a">${ft(t.ar)}${t.egyseg==='kg'?'/kg':''}</span>`:''}</button>`;}
function addItem(id){
  const t=TERMEKEK.find(x=>x.id===id);
  if(t.egyseg==='kg') return numDlg(t.nev,'',v=>{const g=+v;if(g>0){kosar.push({id,nev:t.nev,egyseg:'g',menny:g,ar:t.ar,osszeg:t.ar*g/1000});drawCart();}},false,'gramm (a mérlegről)');
  const e=kosar.find(k=>k.id===id&&k.egyseg==='db');
  if(e){e.menny++;e.osszeg=e.menny*e.ar;}else kosar.push({id,nev:t.nev,egyseg:'db',menny:1,ar:t.ar,osszeg:t.ar});
  drawCart();}
function chg(i,d){const k=kosar[i];if(k.egyseg==='g'){kosar.splice(i,1);}else{k.menny+=d;if(k.menny<=0)kosar.splice(i,1);else k.osszeg=k.menny*k.ar;}drawCart();}
function tetelAfa(k){const t=TERMEKEK.find(x=>x.id===k.id)||{};return helyben&&t.helyben5?5:(t.afa||27);}
function drawCart(){
  $('#items').innerHTML=kosar.map((k,i)=>`<div class="it"><span class="n">${k.nev}${tetelAfa(k)===5?'<span class="afa5">5%</span>':''}<br><span class="muted">${k.menny} ${k.egyseg} · ${ft(k.osszeg)}</span></span>
   <button onclick="chg(${i},-1)">−</button>${k.egyseg==='db'?`<button onclick="chg(${i},1)">+</button>`:''}</div>`).join('')||'<p class="muted">Üres</p>';
  $('#tot').textContent=ft(kosar.reduce((s,k)=>s+k.osszeg,0));}
async function fizet(mod){
  if(!kosar.length)return;
  const rec={id:uid(),ido:nowISO(),dolgozo:user.nev,fizetes:mod,helyben,tetelek:kosar.map(k=>({...k,afa:tetelAfa(k)})),osszeg:Math.round(kosar.reduce((s,k)=>s+k.osszeg,0)),szinkron:false};
  await put('eladas',rec);kosar=[];helyben=false;saleView();toast('Mentve: '+ft(rec.osszeg)+' · '+(mod==='kartya'?'kártya':'készpénz'));szinkron();}

// ---- napi eladás lap (2026-10-18): a papíros hot dog / hamburger / szendvics / Foodora / Munch / kávé lap a tableten ----
let FAJTAK=[],KIFOGY=[];
const FAJTA_KEP={'Foodora rendelés':'logo-foodora.png','Munch csomag':'logo-munch.png'};
function kepSrc(foto){return foto?(/^https?:/.test(foto)?foto:'foto/'+foto):'';}
function fajtaKep(f){if(FAJTA_KEP[f])return FAJTA_KEP[f];const t=TERMEKEK.find(x=>x.nev===f);return t&&t.foto?kepSrc(t.foto):'';}
async function jsonBetolt(fn){try{const r=await fetch(fn,{cache:'no-store'});if(r.ok){const d=await r.json();try{localStorage.setItem(fn,JSON.stringify(d));}catch(e){}return d;}}catch(e){}
  try{return JSON.parse(localStorage.getItem(fn)||'[]');}catch(e){return [];}}
async function fajtakBetolt(){try{const r=await fetch('fajtak.json',{cache:'no-store'});if(r.ok){const d=await r.json();try{localStorage.setItem('fajtak',JSON.stringify(d));}catch(e){}return d;}}catch(e){}
  try{return JSON.parse(localStorage.getItem('fajtak')||'[]');}catch(e){return [];}}
async function lapAdat(){const V=(await all('vonal')).filter(x=>napja(x.ido)===ma()).sort((a,b)=>a.ido.localeCompare(b.ido));
  const E={},M={},O={};V.forEach(x=>{if(x.tipus==='eladva')E[x.fajta]=(E[x.fajta]||0)+(+x.ertek);else if(x.tipus==='maradt')M[x.fajta]=+x.ertek;else if(x.tipus==='osszeg')O[x.fajta]=+x.ertek;});return {E,M,O,V};}
const LAP_SZIN={'Hot dog':'#d9822b','Hamburger':'#b3261e','Szendvics':'#4c8c3a','Termékek':'#a0522d','Foodora és Munch':'#d61f69','Kávé, tea':'#7a4a2a','Extrák':'#8a8a8a'};
let LAPF=[],estiNyitva=false;
// Koppintás: csak az adott csempe száma frissül helyben (nincs újrarajzolás, nincs felugró felirat, nem ugrik a lap).
async function vonal(fajta,d){const {E}=await lapAdat();if(d<0&&!(E[fajta]>0))return;
  await put('vonal',{id:uid(),ido:nowISO(),dolgozo:user.nev,fajta,tipus:'eladva',ertek:d,szinkron:false});toast(fajta+(d>0?' +1':' −1')+' (ma: '+((E[fajta]||0)+d)+')');szinkron();await lapFrissit(fajta);}
async function lapFrissit(villan){const {E,V}=await lapAdat();const ut=lapUtolso(V);
  document.querySelectorAll('#main .p[data-i]').forEach(b=>{const f=LAPF[+b.dataset.i];const d=b.querySelector('.db');if(d)d.textContent=E[f]||0;
    if(f===villan){b.classList.add('fl');setTimeout(()=>b.classList.remove('fl'),350);}});
  const v=document.getElementById('vissza');if(v){v.disabled=!ut;v.textContent='↶ Visszavonás'+(ut?': '+ut.fajta+' −1':'');}}
// Visszavonás: az utolsó, még nem visszavont koppintás (a csempe sarkában lévő −1 helyett, mert véletlenül levonta az eladást).
function lapUtolso(V){const l=[];V.filter(x=>x.tipus==='eladva').forEach(x=>{if(+x.ertek>0)l.push(x);else{for(let i=l.length-1;i>=0;i--){if(l[i].fajta===x.fajta){l.splice(i,1);break;}}}});return l[l.length-1]||null;}
async function vonalVissza(){const {V}=await lapAdat();const u=lapUtolso(V);if(!u){toast('Nincs mit visszavonni');return;}await vonal(u.fajta,-1);}
async function lapSzam(fajta,tipus){const {M,O}=await lapAdat();const eddig=tipus==='maradt'?M[fajta]:O[fajta];
  numDlg(fajta+' – '+(tipus==='maradt'?'maradt vagy kidobva (db)':'napi összeg (Ft)')+(eddig!=null?' · eddig: '+eddig:''),'',async v=>{if(v===''||isNaN(+v))return;
    await put('vonal',{id:uid(),ido:nowISO(),dolgozo:user.nev,fajta,tipus,ertek:+v,szinkron:false});toast('Mentve');szinkron();if(estiNyitva)esti();else if(tab==='lap')lapView();},false,tipus==='maradt'?'darab':'Ft');}
// Esti beírás: külön ablak (maradt/kidobva darab, Foodora/Munch napi összeg), csak kérésre nyílik.
async function esti(){estiNyitva=true;const {E,M,O}=await lapAdat();document.querySelectorAll('.modal.esti').forEach(x=>x.remove());
  const m=document.createElement('div');m.className='modal esti';
  m.innerHTML=`<div class="dlg" style="width:min(560px,96vw);max-height:92vh;overflow-y:auto"><h3>Esti beírás</h3>
   ${FAJTAK.filter(g=>g.maradek||g.osszeg).map(g=>`<div class="lcs">${g.nev.replace(' és Munch','')}</div>`+g.fajtak.map(f=>{const i=LAPF.indexOf(f);return `<div class="it"><span class="n">${f}<br><span class="muted">eladva ${E[f]||0} db${g.maradek?' · maradt/kidobva: '+(M[f]!=null?M[f]+' db':'–'):''}${g.osszeg?' · összeg: '+(O[f]!=null?ft(O[f]):'–'):''}</span></span>
     <button class="jv" onclick="lapSzam(LAPF[${i}],'${g.osszeg?'osszeg':'maradt'}')">${g.osszeg?'Összeg':'Maradt'}</button></div>`;}).join('')).join('')}
   <div class="row"><button class="prim" data-k="x">Kész</button></div></div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target.dataset.k==='x'||e.target===m){estiNyitva=false;m.remove();}};}
async function lapView(){const {E,V,O}=await lapAdat();const ut=lapUtolso(V);LAPF=[];let h='';
  FAJTAK.forEach(g=>{const sz=LAP_SZIN[g.nev]||'#888';h+=`<div class="lgc" style="background:${sz}">${g.nev.replace(' és Munch','')}</div>`;
    g.fajtak.forEach(f=>{const i=LAPF.push(f)-1;const k=fajtaKep(f);
      if(g.osszeg)h+='<div class="par">';
      h+=`<button class="p kis lt" data-i="${i}" style="border-top:4px solid ${sz}" onclick="vonal(LAPF[${i}],1)">${k?`<span class="lk" style="background:#fff url('${k}') center/contain no-repeat"></span>`:''}<span class="db">${E[f]||0}</span><span class="n">${f}</span></button>`;
      if(g.osszeg)h+=`<button class="p kis lt ftcs" style="border-top:4px solid ${sz}" onclick="lapSzam('${f}','osszeg')"><span class="ftk">Ft</span><span class="db">${O[f]!=null?ft(O[f]):'–'}</span><span class="n">${f.split(' ')[0]} napi összeg</span></button></div>`;});});
  $('#main').innerHTML=`<div class="lapfo"><div class="lapfej"><button class="vissza" id="vissza" onclick="vonalVissza()" ${ut?'':'disabled'}>↶ Visszavonás${ut?': '+ut.fajta+' −1':''}</button>
   <button class="estigomb" onclick="esti()">🌙 Esti beírás</button><span class="muted" style="font-size:13px">1 koppintás = 1 darab</span></div><div class="lapg">${h||'<p class="muted">A fajták listája nem töltődött be – frissíts (↻).</p>'}</div></div>`;}

// ---- „Mikor fogyott el?” (a heti papírlap helyett, 2026-10-18) ----------------------------------------------
async function kifAdat(){const m={};(await all('kifogy')).filter(x=>napja(x.ido)===ma()).forEach(x=>{m[x.termek]=x;});return m;}
function oraDlg(cim,elo,torolheto,done){const m=document.createElement('div');m.className='modal';const d=new Date();const most=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  m.innerHTML=`<div class="dlg"><h3>${cim}</h3><p class="muted" style="margin:0 0 8px">Hánykor fogyott el az utolsó darab?</p>
   <input id="ti" type="time" value="${elo||most}" style="font-size:34px;padding:10px;width:100%;box-sizing:border-box;text-align:center">
   <div class="row"><button data-k="x">Mégse</button>${torolheto?'<button data-k="del">Törlés</button>':''}<button class="prim" data-k="ok">Mentés</button></div></div>`;
  document.body.appendChild(m);m.onclick=e=>{const k=e.target.dataset.k;if(!k)return;const v=m.querySelector('#ti').value;m.remove();if(k==='ok'&&v)done(v);else if(k==='del')done('');};}
async function kifMent(termek,ora){const M=await kifAdat();const e=M[termek];
  if(e){await put('kifogy',{...e,ora,eredeti_ora:e.eredeti_ora??e.ora,javitva:nowISO(),javito:user.nev,szinkron:false});}
  else{await put('kifogy',{id:uid(),ido:nowISO(),dolgozo:user.nev,termek,ora,szinkron:false});}
  toast(ora?'Mentve: '+ora:'Törölve');kifView();szinkron();}
async function kifKoppint(i){const k=KIFOGY[i];const e=(await kifAdat())[k.termek];const mar=e&&e.ora;
  oraDlg(k.lap,mar?e.ora:'',!!mar,v=>kifMent(k.termek,v));}
let kifKeres='';
async function kifView(){const M=await kifAdat();const lista=Object.values(M).filter(x=>x.ora).sort((a,b)=>a.ora.localeCompare(b.ora));
  $('#main').innerHTML=`<div class="sale"><div class="left">
   <div class="muted" style="padding:10px 10px 0">Amikor egy termékből az utolsó darab is elfogyott, koppints rá, és mentsd az időpontot (alapból a mostani idő). Ami zárásig megmaradt, azt ne érintsd.</div>
   <input class="search" placeholder="Keresés…" value="${kifKeres}" oninput="kifKeres=this.value;kifGrid()">
   <div class="grid" id="kgrid"></div></div>
   <div class="cart"><h2>Mai kifogyások</h2><div class="items">${lista.map(x=>{const k=KIFOGY.find(y=>y.termek===x.termek)||{lap:x.termek};return `<div class="it"><span class="n">${k.lap}<br><span class="muted">${x.ora} · ${x.dolgozo}${x.javitva?' · javítva':''}</span></span><button class="jv" onclick="kifKoppint(${KIFOGY.indexOf(k)})">Javít</button></div>`;}).join('')||'<p class="muted">Még nincs</p>'}</div></div></div>`;kifGrid();}
async function kifGrid(){const M=await kifAdat();let h='',cs='';
  KIFOGY.forEach((k,i)=>{if(kifKeres&&!nrm(k.lap+' '+k.termek).includes(nrm(kifKeres)))return;if(k.besz!==cs){cs=k.besz;h+=`<div class="lcs" style="grid-column:1/-1;padding:4px 2px 0">${cs}</div>`;}
    const t=TERMEKEK.find(x=>x.nev===k.termek);const src=t&&t.foto?kepSrc(t.foto):'';const e=M[k.termek];
    h+=`<button class="p" onclick="kifKoppint(${i})" style="position:relative">${e&&e.ora?`<span class="ora">${e.ora}</span>`:''}<span class="kep" ${src?`style="background:#fff url('${src}') center/contain no-repeat"`:''}>${src?'':k.lap.slice(0,1)}</span><span class="n">${k.lap}</span></button>`;});
  const g=$('#kgrid');if(g)g.innerHTML=h||'<p class="muted" style="padding:10px">Nincs találat</p>';}

// Bemutató / teszt: ?demo=elad | stat — tesztadatot tölt be, csak próbához.
async function demo(nezet){
  user=nezet==='stat'?{nev:'Tulajdonos',tulaj:true}:{nev:'Teszt'};tab=nezet;
  if(nezet==='elad'){const b=TERMEKEK.find(t=>t.kat==='Kenyerek');kosar=[{id:b.id,nev:b.nev,egyseg:'db',menny:2,ar:b.ar,osszeg:2*b.ar}];
    const k=TERMEKEK.find(t=>t.nev.startsWith('Kifli vázsonyi'));if(k){kosar.push({id:k.id,nev:k.nev,egyseg:'db',menny:5,ar:k.ar,osszeg:5*k.ar});}return;}
  if((await all('eladas')).length)return;
  const nap=ma();statNap=nap;
  const pek=TERMEKEK.filter(t=>t.kat==='Péksütemények'||t.kat==='Kávé, tea');const EL=[],SU=[];
  for(let h=5;h<18;h++){const n=h<9?14:h<12?9:5;for(let i=0;i<n;i++){const x=new Date(nap+'T00:00:00');x.setHours(h,Math.floor(Math.random()*60));
    const t=[pek[Math.floor(Math.random()*pek.length)],pek[Math.floor(Math.random()*pek.length)]].map(p=>({id:p.id,nev:p.nev,egyseg:'db',menny:1,ar:p.ar,osszeg:p.ar}));
    EL.push({id:uid(),ido:x.toISOString(),dolgozo:i%3?'Teszt Anna':'Teszt Béla',fizetes:i%2?'kartya':'keszpenz',tetelek:t,osszeg:t.reduce((s,k)=>s+k.osszeg,0),demo:true});}
    if(h<11){const x=new Date(nap+'T00:00:00');x.setHours(h,10);SU.push({id:uid(),ido:x.toISOString(),termek_id:1,nev:'Sajtos pogácsa',db:30,dolgozo:'Teszt Béla',demo:true});}}
  await putMany('eladas',EL);await putMany('sutes',SU);}
