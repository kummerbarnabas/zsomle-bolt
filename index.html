<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zsömle bolt">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Zsömle bolt</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2118;--muted:#7a6d60;--brand:#8a4b1e;--ok:#2f7d32;--warn:#b3261e;--line:#e4ddd3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
button{font:inherit;border:0;border-radius:12px;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--brand);color:#fff}
.top h1{font-size:20px;margin:0 12px 0 0}
.top .tab{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px}
.top .tab.on{background:#fff;color:var(--brand);font-weight:600}
.top .sp{flex:1}
.top .who{font-size:15px;opacity:.9}
.net{font-size:13px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.2)}
.net:empty{display:none}
main{height:calc(100vh - 62px);overflow:hidden}
.sale{display:grid;grid-template-columns:1fr 340px;height:100%}
.left{display:flex;flex-direction:column;overflow:hidden}
.cats{display:flex;gap:6px;padding:10px;overflow-x:auto;flex:none}
.cats button{background:var(--card);padding:10px 14px;white-space:nowrap;border:1px solid var(--line)}
.cats button.on{background:var(--ink);color:#fff}
.search{margin:0 10px 8px;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 10px 10px;overflow-y:auto}
.p{background:var(--card);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:center}
.p .kep{width:100%;aspect-ratio:4/3;border-radius:8px;background:#efe7dc center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b9a892;font-size:26px;font-weight:700}
.p .n{font-size:14px;line-height:1.2;min-height:34px}
.p .a{font-weight:700;color:var(--brand)}
.p.kis{padding:10px;min-height:70px;justify-content:center}
.cart{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart h2{margin:12px 14px 6px;font-size:18px}
.items{flex:1;overflow-y:auto;padding:0 10px}
.it{display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid var(--line)}
.it .n{flex:1;font-size:14px}
.it button{width:36px;height:36px;background:var(--bg);font-size:20px}
.sum{padding:12px 14px;font-size:26px;font-weight:700;display:flex;justify-content:space-between}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 12px}
.pay button{padding:20px 0;font-size:19px;color:#fff;background:var(--ok)}
.pay button.card{background:#1f5fa8}
.pay .clr{grid-column:1/3;background:var(--bg);color:var(--ink);padding:12px}
.panel{padding:16px;overflow-y:auto;height:100%}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:360px}
.dlg h3{margin:0 0 10px}
.dlg input{width:100%;font-size:28px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keys button{padding:16px 0;font-size:22px;background:var(--bg)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;padding:14px}
.prim{background:var(--brand);color:#fff}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px}
.login .names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px}
.login .names button{background:var(--card);border:1px solid var(--line);padding:18px 26px;font-size:19px}
.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:10}
.bar{height:10px;background:var(--brand);border-radius:5px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- beállítások -------------------------------------------------------------
// Supabase: a publishable kulcs nyilvános, a böngészőbe való; csak a termékek olvasását és a
// bekuld() függvényt engedi (a jogokat lásd db/001_alap.sql, db/002_bekuldes.sql).
const SB_URL='https://dqttcjxviijeopzbqfqq.supabase.co', SB_KEY='sb_publishable_S4aefwe9JNDz5hunZdHF9Q_iRBRbmvP';
const sb=(path,opt={})=>fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});
// Dolgozók (a tulajdonos megadása, 2026-10-16). A PIN-ek helyett csak SHA-256('zsomle:'+PIN)
// lenyomat szerepel, mert a kód nyilvános tárhelyen van. Új dolgozó: lenyomat a README szerint.
const DOLGOZOK = [
  {nev:'Marcsi',h:'09dfb88cd0459a5763276403b0caa0851de0511b578c4fc13d07634b96e1fec1'},
  {nev:'Niki',h:'996d96dc869bfea093a83a838e1c11ba0d22f9182c29cb569566d4b5007a5637'},
  {nev:'Ildi',h:'2559e1f4a57b03cb669767c0789a9c8b70a26fe8c874c729e8b0312b1877296b'}];
const TULAJ_H = 'a623a76850b821af97cc29e48e64916730601a751285edd0bb773991ea4d7c83';
let tulajJelszo = null; // csak a memóriában, a szerveres statisztikához
async function lenyomat(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('zsomle:'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
// Külső kapcsolatok: kiépítve, de a felhasználó döntése szerint (2026-10-16) kikapcsolva.
const KAPCSOLATOK = {weboldal:false, google:false, facebook:false};
const NYITVA = {1:[5,18],2:[5,18],3:[5,18],4:[5,18],5:[5,18],6:[6,12]}; // hétfő=1

// ---- tárolás: IndexedDB, internet nélkül is ------------------------------------
let db;
function openDB(){return new Promise((ok,err)=>{const r=indexedDB.open('zsomle-bolt',1);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['eladas','sutes','maradek'])d.createObjectStore(s,{keyPath:'id'});};
  r.onsuccess=()=>{db=r.result;ok()};r.onerror=err;});}
function put(store,obj){return new Promise(ok=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=ok;});}
function putMany(store,arr){return new Promise(ok=>{const t=db.transaction(store,'readwrite');const s=t.objectStore(store);arr.forEach(o=>s.put(o));t.oncomplete=ok;});}
function all(store){return new Promise(ok=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>ok(q.result);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const napja=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ma=()=>napja(new Date().toISOString());
// Szinkron: minden rekord szinkron:false-szal indul; a Supabase-kapcsolat (később) ezeket küldi fel.
let szinkronFut=false, varakozik=0;
async function szinkron(){
  if(szinkronFut||!navigator.onLine)return;szinkronFut=true;
  try{const L={};for(const s of ['eladas','sutes','maradek'])L[s]=(await all(s)).filter(r=>!r.szinkron&&!r.demo);
    const n=L.eladas.length+L.sutes.length+L.maradek.length;
    if(n){const r=await fetch(SB_URL+'/rest/v1/rpc/bekuld',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({p_eladas:L.eladas,p_sutes:L.sutes,p_maradek:L.maradek})});
      if(r.ok){for(const s in L)await putMany(s,L[s].map(x=>({...x,szinkron:true})));}}
  }catch(e){}finally{szinkronFut=false;varakozik=await fuggo();const e=document.getElementById('fuggo');if(e)e.textContent=varakozik?varakozik+' felküldésre vár':'';}}
async function fuggo(){let n=0;for(const s of ['eladas','sutes','maradek'])n+=(await all(s)).filter(r=>!r.szinkron&&!r.demo).length;return n;}
setInterval(szinkron,60000);

// ---- állapot -------------------------------------------------------------------
let TERMEKEK=[], user=null, tab='elad', kat='Kenyerek', keres='', kosar=[];
const ft=n=>Math.round(n).toLocaleString('hu-HU')+' Ft';
const $=s=>document.querySelector(s);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}

// ---- belépés -------------------------------------------------------------------
function loginView(){
  $('#app').innerHTML=`<div class="login"><h1>Zsömle — bolt</h1><div class="muted">Válaszd ki a neved</div>
  <div class="names">${DOLGOZOK.map((d,i)=>`<button onclick="pinDlg(${i})">${d.nev}</button>`).join('')}
  <button onclick="pinDlg(-1)">Tulajdonos</button></div></div>`;}
function pinDlg(i){
  numDlg(i<0?'Tulajdonosi jelszó':DOLGOZOK[i].nev+' – PIN', '', async v=>{
    const h=await lenyomat(v);
    if(i<0? h===TULAJ_H : h===DOLGOZOK[i].h){user=i<0?{nev:'Tulajdonos',tulaj:true}:{nev:DOLGOZOK[i].nev};if(i<0)tulajJelszo=v;tab=user.tulaj?'stat':'elad';render();}
    else toast('Hibás PIN');}, true);}

// ---- számbillentyűzet ------------------------------------------------------------
function numDlg(title,init,done,pw,unit){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="dlg"><h3>${title}</h3><input id="nv" ${pw?'type="password"':''} value="${init}" readonly>
  ${unit?`<div class="muted" style="text-align:center;margin-top:4px">${unit}</div>`:''}
  <div class="keys">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
  <div class="row"><button data-k="x">Mégse</button><button class="prim" data-k="ok">OK</button></div></div>`;
  document.body.appendChild(m);const inp=m.querySelector('#nv');
  m.onclick=e=>{const k=e.target.dataset.k;if(k===undefined)return;
    if(k==='x')m.remove();else if(k==='ok'){m.remove();done(inp.value);}
    else if(k==='C')inp.value='';else if(k==='⌫')inp.value=inp.value.slice(0,-1);else inp.value+=k;};}

// ---- fő nézet ------------------------------------------------------------------
function render(){
  if(!user)return loginView();
  const tabs=[['elad','Eladás'],['sut','Sütés'],['mar','Maradék / selejt'],['stat','Statisztika']];
  if(user.tulaj)tabs.push(['beall','Beállítások']);
  $('#app').innerHTML=`<div class="top"><h1>Zsömle</h1>${tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}
  <span class="sp"></span><span class="net" id="fuggo">${varakozik?varakozik+' felküldésre vár':''}</span><span class="net">${navigator.onLine?'online':'offline – helyben mentve'}</span>
  <span class="who">${user.nev}</span><button class="tab" onclick="user=null;tulajJelszo=null;kosar=[];render()">Kilépés</button></div><main id="main"></main>`;
  ({elad:saleView,sut:bakeView,mar:leftView,stat:statView,beall:setView})[tab]();}

// ---- eladás --------------------------------------------------------------------
function cats(){return [...new Set([...TERMEKEK].sort((a,b)=>a.sorrend-b.sorrend).map(t=>t.kat))];}
function saleView(){
  const list=TERMEKEK.filter(t=>keres?t.nev.toLowerCase().includes(keres.toLowerCase()):t.kat===kat);
  $('#main').innerHTML=`<div class="sale"><div class="left">
   <div class="cats">${cats().map(c=>`<button class="${!keres&&c===kat?'on':''}" onclick="kat='${c}';keres='';saleView()">${c}</button>`).join('')}</div>
   <input class="search" placeholder="Keresés…" value="${keres}" oninput="keres=this.value;drawGrid()">
   <div class="grid" id="grid"></div></div>
   <div class="cart"><h2>Kosár</h2><div class="items" id="items"></div>
   <div class="sum"><span>Összesen</span><span id="tot"></span></div>
   <div class="pay"><button onclick="fizet('keszpenz')">Készpénz</button><button class="card" onclick="fizet('kartya')">Kártya</button>
   <button class="clr" onclick="kosar=[];drawCart()">Kosár ürítése</button></div></div></div>`;
  drawGrid();drawCart();}
function drawGrid(){
  const list=TERMEKEK.filter(t=>keres?t.nev.toLowerCase().includes(keres.toLowerCase()):t.kat===kat);
  $('#grid').innerHTML=list.map(t=>csempe(t,`addItem(${t.id})`,true)).join('');}
// Csempe: felül a kép (a felhasználó készíti; addig helykitöltő), alatta a név és az ár.
function csempe(t,onclick,arral){const src=t.foto&&(/^https?:/.test(t.foto)?t.foto:'foto/'+t.foto);const kep=src?`style="background:#fff url('${src}') center/contain no-repeat"`:'';
  return `<button class="p" onclick="${onclick}"><span class="kep" ${kep}>${t.foto?'':(t.rovid||t.nev).slice(0,1)}</span>
   <span class="n">${t.rovid||t.nev}</span>${arral?`<span class="a">${ft(t.ar)}${t.egyseg==='kg'?'/kg':''}</span>`:''}</button>`;}
function addItem(id){
  const t=TERMEKEK.find(x=>x.id===id);
  if(t.egyseg==='kg') return numDlg(t.nev,'',v=>{const g=+v;if(g>0){kosar.push({id,nev:t.nev,egyseg:'g',menny:g,ar:t.ar,osszeg:t.ar*g/1000});drawCart();}},false,'gramm (a mérlegről)');
  const e=kosar.find(k=>k.id===id&&k.egyseg==='db');
  if(e){e.menny++;e.osszeg=e.menny*e.ar;}else kosar.push({id,nev:t.nev,egyseg:'db',menny:1,ar:t.ar,osszeg:t.ar});
  drawCart();}
function chg(i,d){const k=kosar[i];if(k.egyseg==='g'){kosar.splice(i,1);}else{k.menny+=d;if(k.menny<=0)kosar.splice(i,1);else k.osszeg=k.menny*k.ar;}drawCart();}
function drawCart(){
  $('#items').innerHTML=kosar.map((k,i)=>`<div class="it"><span class="n">${k.nev}<br><span class="muted">${k.menny} ${k.egyseg} · ${ft(k.osszeg)}</span></span>
   <button onclick="chg(${i},-1)">−</button>${k.egyseg==='db'?`<button onclick="chg(${i},1)">+</button>`:''}</div>`).join('')||'<p class="muted">Üres</p>';
  $('#tot').textContent=ft(kosar.reduce((s,k)=>s+k.osszeg,0));}
async function fizet(mod){
  if(!kosar.length)return;
  const rec={id:uid(),ido:nowISO(),dolgozo:user.nev,fizetes:mod,tetelek:kosar,osszeg:Math.round(kosar.reduce((s,k)=>s+k.osszeg,0)),szinkron:false};
  await put('eladas',rec);kosar=[];drawCart();toast('Mentve: '+ft(rec.osszeg)+' · '+(mod==='kartya'?'kártya':'készpénz'));szinkron();}

// ---- sütés ---------------------------------------------------------------------
async function bakeView(){
  const today=(await all('sutes')).filter(s=>napja(s.ido)===ma()).sort((a,b)=>b.ido.localeCompare(a.ido));
  const forn=TERMEKEK.filter(t=>t.kat==='Fornetti');
  $('#main').innerHTML=`<div class="sale"><div class="left"><div class="muted" style="padding:10px">Koppints a termékre, és írd be, hány darabot sütöttél. Az időpont magától mentődik.</div>
   <div class="grid">${forn.map(t=>csempe(t,`sut(${t.id})`,false)).join('')}</div></div>
   <div class="cart"><h2>Mai sütések</h2><div class="items">${today.map(s=>`<div class="it"><span class="n">${s.nev}<br><span class="muted">${new Date(s.ido).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})} · ${s.db} db · ${s.dolgozo}</span></span></div>`).join('')||'<p class="muted">Még nincs</p>'}</div></div></div>`;}
function sut(id){const t=TERMEKEK.find(x=>x.id===id);numDlg(t.nev+' – sütés','',async v=>{const n=+v;if(n>0){await put('sutes',{id:uid(),ido:nowISO(),termek_id:id,nev:t.nev,db:n,dolgozo:user.nev,szinkron:false});toast(n+' db mentve');bakeView();}},false,'darab');}

// ---- maradék és selejt ----------------------------------------------------------
let marTipus='maradek', marKat='Kenyerek';
async function leftView(){
  const kats=['Kenyerek','Péksütemények','Sütemények','Fornetti','Hot dog és hamburger','Szendvicsek'];
  const today=(await all('maradek')).filter(s=>napja(s.ido)===ma());
  $('#main').innerHTML=`<div class="sale"><div class="left">
   <div class="cats"><button class="${marTipus==='maradek'?'on':''}" onclick="marTipus='maradek';leftView()">Esti maradék</button>
   <button class="${marTipus==='selejt'?'on':''}" onclick="marTipus='selejt';leftView()">Selejt (kidobva)</button>
   <span style="width:16px"></span>${kats.map(c=>`<button class="${c===marKat?'on':''}" onclick="marKat='${c}';leftView()">${c}</button>`).join('')}</div>
   <div class="grid">${TERMEKEK.filter(t=>t.kat===marKat).map(t=>csempe(t,`mar(${t.id})`,false)).join('')}</div></div>
   <div class="cart"><h2>Mai rögzítés</h2><div class="items">${today.map(s=>`<div class="it"><span class="n">${s.nev}<br><span class="muted">${s.tipus==='selejt'?'selejt':'maradék'} · ${s.menny} ${s.egyseg} · ${s.dolgozo}</span></span></div>`).join('')||'<p class="muted">Még nincs</p>'}</div></div></div>`;}
function mar(id){const t=TERMEKEK.find(x=>x.id===id);const eg=t.egyseg==='kg'?'db':'db';
  numDlg(t.nev+' – '+(marTipus==='selejt'?'selejt':'maradék'),'',async v=>{const n=+v;if(v!==''){await put('maradek',{id:uid(),ido:nowISO(),termek_id:id,nev:t.nev,tipus:marTipus,menny:n,egyseg:eg,dolgozo:user.nev,szinkron:false});toast('Mentve');leftView();}},false,'darab');}

// ---- statisztika ----------------------------------------------------------------
let statNap=ma();
async function statAdat(){
  if(tulajJelszo&&navigator.onLine){try{await szinkron();const r=await fetch(SB_URL+'/rest/v1/rpc/tulaj_adatok',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_jelszo:tulajJelszo,p_tol:statNap,p_ig:statNap})});
    if(r.ok){const d=await r.json();return {el:d.eladas,su:d.sutes,forras:'online adatbázis (minden eszköz)'};}}catch(e){}}
  return {el:(await all('eladas')).filter(e=>napja(e.ido)===statNap),su:(await all('sutes')).filter(e=>napja(e.ido)===statNap),forras:'ezen az eszközön rögzített adatok'};}
async function statView(){
  const {el,su,forras}=await statAdat();
  const hour=i=>new Date(i).getHours();
  const tot=el.reduce((s,e)=>s+e.osszeg,0), vevo=el.length;
  const kp=el.filter(e=>e.fizetes==='keszpenz').reduce((s,e)=>s+e.osszeg,0);
  const H={};for(let h=5;h<=18;h++)H[h]={ft:0,db:0,vevo:0,sut:0};
  el.forEach(e=>{e.osszeg=+e.osszeg;const h=H[hour(e.ido)]||(H[hour(e.ido)]={ft:0,db:0,vevo:0,sut:0});h.ft+=e.osszeg;h.vevo++;h.db+=e.tetelek.reduce((s,t)=>s+(t.egyseg==='db'?t.menny:1),0);});
  su.forEach(s=>{const h=H[hour(s.ido)]||(H[hour(s.ido)]={ft:0,db:0,vevo:0,sut:0});h.sut+=+s.db;});
  const max=Math.max(1,...Object.values(H).map(h=>h.ft));
  const D={};el.forEach(e=>{const d=D[e.dolgozo]||(D[e.dolgozo]={ft:0,vevo:0});d.ft+=e.osszeg;d.vevo++;});
  const P={};el.forEach(e=>e.tetelek.forEach(t=>{const p=P[t.nev]||(P[t.nev]={menny:0,egyseg:t.egyseg,ft:0});p.menny+=t.menny;p.ft+=t.osszeg;}));
  $('#main').innerHTML=`<div class="panel">
   <div class="box" style="display:flex;gap:10px;align-items:center"><b>Nap:</b><input type="date" value="${statNap}" onchange="statNap=this.value;statView()" style="font-size:17px;padding:6px"><span class="muted">Forrás: ${forras}</span></div>
   <div class="kpis"><div class="kpi">Bevétel<b>${ft(tot)}</b></div><div class="kpi">Vevőszám<b>${vevo}</b></div>
    <div class="kpi">Átlagos kosár<b>${vevo?ft(tot/vevo):'–'}</b></div><div class="kpi">Készpénz / kártya<b style="font-size:18px">${ft(kp)} / ${ft(tot-kp)}</b></div></div>
   <div class="box" style="margin-top:12px"><h3>Óránként</h3><table><tr><th>Óra</th><th>Bevétel</th><th></th><th>Vevő</th><th>Eladott db</th><th>Sütés db</th></tr>
    ${Object.entries(H).sort((a,b)=>a[0]-b[0]).map(([h,v])=>`<tr><td>${h}–${+h+1}</td><td>${ft(v.ft)}</td><td style="width:30%"><div class="bar" style="width:${v.ft/max*100}%"></div></td><td>${v.vevo}</td><td>${v.db}</td><td>${v.sut}</td></tr>`).join('')}</table></div>
   <div class="box"><h3>Dolgozónként</h3><table><tr><th>Dolgozó</th><th>Bevétel</th><th>Vevő</th><th>Átlagos kosár</th></tr>
    ${Object.entries(D).sort((a,b)=>b[1].ft-a[1].ft).map(([n,v])=>`<tr><td>${n}</td><td>${ft(v.ft)}</td><td>${v.vevo}</td><td>${ft(v.ft/v.vevo)}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">Nincs adat</td></tr>'}</table></div>
   <div class="box"><h3>Termékenként</h3><table><tr><th>Termék</th><th>Mennyiség</th><th>Bevétel</th></tr>
    ${Object.entries(P).sort((a,b)=>b[1].ft-a[1].ft).map(([n,v])=>`<tr><td>${n}</td><td>${v.menny} ${v.egyseg}</td><td>${ft(v.ft)}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">Nincs adat</td></tr>'}</table></div></div>`;}

// ---- beállítások (tulajdonos) -----------------------------------------------------
function setView(){
  $('#main').innerHTML=`<div class="panel"><div class="box"><h3>Külső kapcsolatok</h3>
   <p class="muted">Kiépítve, de egyelőre kikapcsolva (a tulajdonos döntése, 2026-10-16). Bekapcsolás később, a hiányzó beállítások után.</p>
   ${[['weboldal','Weboldal (árak, „most kapható”)'],['google','Google Cégprofil („Most sült ki” javaslat, zárás)'],['facebook','Facebook (történetjavaslat)']].map(([k,n])=>
   `<div class="sw"><span>${n}</span><span class="muted">${KAPCSOLATOK[k]?'bekapcsolva':'kikapcsolva'}</span></div>`).join('')}</div>
   <div class="box"><h3>Adatok</h3><p class="muted">Az adatok ezen az iPaden is megvannak (internet nélkül is). Az online adatbázis a Supabase-fiók után kapcsolódik.</p></div></div>`;}

// ---- indulás ---------------------------------------------------------------------
window.addEventListener('online',()=>{render();szinkron();});window.addEventListener('offline',render);
async function termekekBetolt(){
  try{const r=await sb('termekek?select=id,nev,rovid,kat,ar,egyseg,foto,sorrend&order=sorrend');if(r.ok){const d=await r.json();if(d.length){localStorage.setItem('termekek',JSON.stringify(d));return d;}}}catch(e){}
  try{const c=localStorage.getItem('termekek');if(c)return JSON.parse(c);}catch(e){}
  return await (await fetch('termekek.json')).json();}
(async()=>{await openDB();TERMEKEK=await termekekBetolt();szinkron();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const q=new URLSearchParams(location.search);
  if(q.get('demo')){await demo(q.get('demo'));}
  render();})();
// Bemutató / teszt: ?demo=elad | stat — tesztadatot tölt be, csak próbához.
async function demo(nezet){
  user=nezet==='stat'?{nev:'Tulajdonos',tulaj:true}:{nev:'Teszt'};tab=nezet;
  if(nezet==='elad'){const b=TERMEKEK.find(t=>t.kat==='Kenyerek');kosar=[{id:b.id,nev:b.nev,egyseg:'db',menny:2,ar:b.ar,osszeg:2*b.ar}];
    const k=TERMEKEK.find(t=>t.nev.startsWith('Kifli vázsonyi'));if(k){kosar.push({id:k.id,nev:k.nev,egyseg:'db',menny:5,ar:k.ar,osszeg:5*k.ar});}return;}
  if((await all('eladas')).length)return;
  const nap=ma();statNap=nap;
  const pek=TERMEKEK.filter(t=>t.kat==='Péksütemények'||t.kat==='Kávé, tea');const EL=[],SU=[];
  for(let h=5;h<18;h++){const n=h<9?14:h<12?9:5;for(let i=0;i<n;i++){const x=new Date(nap+'T00:00:00');x.setHours(h,Math.floor(Math.random()*60));
    const t=[pek[Math.floor(Math.random()*pek.length)],pek[Math.floor(Math.random()*pek.length)]].map(p=>({id:p.id,nev:p.nev,egyseg:'db',menny:1,ar:p.ar,osszeg:p.ar}));
    EL.push({id:uid(),ido:x.toISOString(),dolgozo:i%3?'Teszt Anna':'Teszt Béla',fizetes:i%2?'kartya':'keszpenz',tetelek:t,osszeg:t.reduce((s,k)=>s+k.osszeg,0),demo:true});}
    if(h<11){const x=new Date(nap+'T00:00:00');x.setHours(h,10);SU.push({id:uid(),ido:x.toISOString(),termek_id:1,nev:'Sajtos pogácsa',db:30,dolgozo:'Teszt Béla',demo:true});}}
  await putMany('eladas',EL);await putMany('sutes',SU);}
</script>
